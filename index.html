let _uidCounter = 1000;
function uid() { return 'id' + (++_uidCounter) + Math.random().toString(36).slice(2,6); }

function currency(n) {
  if (n === null || n === undefined || isNaN(n)) return '$0';
  const abs = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  if (abs >= 1000000) return sign + '$' + (abs/1000000).toFixed(1).replace(/\.0$/,'') + 'M';
  if (abs >= 1000) return sign + '$' + (abs/1000).toFixed(1).replace(/\.0$/,'') + 'K';
  return sign + '$' + abs.toLocaleString();
}

function pct(n) {
  if (n === null || n === undefined || isNaN(n)) return '0.0%';
  return n.toFixed(1) + '%';
}

function calcMetrics(scenario) {
  const units = Number(scenario.units) || 0;
  const rpu = Number(scenario.revenuePerUnit) || 0;
  const rev = units * rpu;
  let tot = 0, direct = 0;
  (scenario.categories || []).forEach(cat => {
    (cat.items || []).forEach(item => {
      const v = Number(item.value) || 0;
      tot += v;
      if (cat.isDirectCost) direct += v;
    });
  });
  const gross = rev - direct;
  const net = rev - tot;
  const grossMgn = rev > 0 ? (gross / rev) * 100 : 0;
  const netMgn = rev > 0 ? (net / rev) * 100 : 0;
  const cpu = units > 0 ? tot / units : 0;
  const ppu = units > 0 ? net / units : 0;
  return { rev, tot, direct, gross, net, grossMgn, netMgn, cpu, ppu };
}

function Icon({ name, size=16, cls='' }) {
  const d = ICONS[name];
  if (!d) return null;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
      className={cls}>
      <path d={d} />
    </svg>
  );
}

  return (
    <button title={title} disabled={disabled} onClick={onClick}
      className={`${base} ${sizes[sz]} ${vars[v]} ${dis} ${cls}`}>
      {children}
    </button>
  );
}

function Badge({ color='gray', cls='', children }) {
  const colors = {
    gray:   'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300',
    indigo: 'bg-indigo-100 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300',
    sky:    'bg-sky-100 dark:bg-sky-900/40 text-sky-700 dark:text-sky-300',
    violet: 'bg-violet-100 dark:bg-violet-900/40 text-violet-700 dark:text-violet-300',
    green:  'bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300',
    amber:  'bg-amber-100 dark:bg-amber-900/40 text-amber-700 dark:text-amber-300',
    red:    'bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-300',
    blue:   'bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300',
  };
  return <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium ${colors[color]} ${cls}`}>{children}</span>;
}

function Card({ cls='', onClick, children }) {
  const interClass = onClick ? 'cursor-pointer hover:shadow-md hover:-translate-y-0.5 transition-all duration-150' : '';
  return (
    <div onClick={onClick}
      className={`bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm ${interClass} ${cls}`}>
      {children}
    </div>
  );
}

function Toast({ toast, onDismiss }) {
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(onDismiss, 3000);
    return () => clearTimeout(t);
  }, [toast]);
  if (!toast) return null;
  const icons = { success:'check', error:'alert', info:'info' };
  const styles = {
    success:'bg-emerald-600 text-white',
    error:'bg-red-600 text-white',
    info:'bg-slate-800 dark:bg-slate-700 text-white',
  };
  return (
    <div className={`fixed top-5 right-5 z-50 flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-xl fade-up ${styles[toast.type||'info']}`}>
      <Icon name={icons[toast.type||'info']} size={16} />
      <span className="text-sm font-medium">{toast.msg}</span>
      <button onClick={onDismiss} className="ml-1 opacity-75 hover:opacity-100"><Icon name="x" size={14} /></button>
    </div>
  );
}

// ── Star Icon (filled variant) ─────────────────────────────────────────────
function StarIcon({ filled=false, size=16, cls='' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24"
      fill={filled ? '#f59e0b' : 'none'} stroke={filled ? '#f59e0b' : 'currentColor'}
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={cls}>
      <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
    </svg>
  );
}

// ── Dashboard ──────────────────────────────────────────────────────────────
function KPICard({ icon, iconBg, label, value, sub }) {

          <p className="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wide">{label}</p>
          <p className="text-2xl font-bold mt-1 text-slate-800 dark:text-slate-100">{value}</p>
          {sub && <p className="text-xs text-slate-400 mt-0.5 truncate">{sub}</p>}

          <Icon name={icon} size={18} cls="text-white" />
        </div>

}

function ProjectCard({ project, onOpen }) {
  const scenarios = project.scenarios || [];
  const allMetrics = scenarios.map(s => calcMetrics(s));
  const bestMargin = allMetrics.length ? Math.max(...allMetrics.map(m => m.netMgn)) : 0;
  const totalRev = allMetrics.reduce((a, m) => a + m.rev, 0);
  return (
    <Card cls="p-5" onClick={onOpen}>
      <div className="flex items-start justify-between mb-3">
        <div className="flex-1 min-w-0 mr-3">
          <h3 className="font-semibold text-sm leading-snug line-clamp-2 text-slate-800 dark:text-slate-100">{project.name}</h3>
          <p className="text-xs text-slate-400 mt-1 line-clamp-1">{project.description}</p>
        </div>
        <Badge color={project.status === 'active' ? 'green' : 'amber'}>{project.status}</Badge>
      </div>
      <div className="flex gap-2 mb-3">
        {scenarios.map((s, i) => (
          <div key={s.id} className="flex items-center gap-1.5 flex-1 min-w-0">
            <span className="w-2 h-2 rounded-full flex-shrink-0" style={{background: SCOL[i]?.dot || '#94a3b8'}} />

        <span className="text-xs text-slate-400 flex items-center gap-1">
          <Icon name="clock" size={11} />{project.updatedAt}
        </span>
        <span className="text-xs font-semibold text-indigo-600 dark:text-indigo-400">

// ── Comparison Table ───────────────────────────────────────────────────────
function ComparisonTable({ scenarios }) {
  const metrics = scenarios.map(s => calcMetrics(s));
  const rows = [
    {key:'rev',    label:'Total Revenue',   vals:metrics.map(m=>m.rev),      fmt:currency, best:'high'},
    {key:'tot',    label:'Total Cost',      vals:metrics.map(m=>m.tot),      fmt:currency, best:'low'},
    {key:'direct', label:'Direct Costs',    vals:metrics.map(m=>m.direct),   fmt:currency, best:'low'},
    {key:'gross',  label:'Gross Profit',    vals:metrics.map(m=>m.gross),    fmt:currency, best:'high'},
    {key:'net',    label:'Net Profit',      vals:metrics.map(m=>m.net),      fmt:currency, best:'high'},
    {key:'grossMgn',label:'Gross Margin',   vals:metrics.map(m=>m.grossMgn), fmt:pct,      best:'high'},
    {key:'netMgn', label:'Net Margin',      vals:metrics.map(m=>m.netMgn),   fmt:pct,      best:'high'},
    {key:'cpu',    label:'Cost / Unit',     vals:metrics.map(m=>m.cpu),      fmt:currency, best:'low'},
    {key:'ppu',    label:'Profit / Unit',   vals:metrics.map(m=>m.ppu),      fmt:currency, best:'high'},
  ];
  const getBest = (vals, dir) => dir==='high' ? vals.indexOf(Math.max(...vals)) : vals.indexOf(Math.min(...vals));
  return (
    <div className="overflow-x-auto">
      <table className="w-full text-sm">
        <thead>
          <tr className="border-b border-slate-200 dark:border-slate-700">
            <th className="text-left py-3 px-4 text-xs font-semibold uppercase tracking-wide text-slate-500">Metric</th>
            {scenarios.map((s,i)=>(
              <th key={s.id} className="text-right py-3 px-4 font-medium">
                <div className="flex items-center justify-end gap-1.5">
                  <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{background:SCOL[i]?.dot}} />
                  <span className="text-xs">{s.subtitle||s.name}</span>
                </div>
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.map(row=>{
            const bi = getBest(row.vals, row.best);
            return (
              <tr key={row.key} className="border-b border-slate-100 dark:border-slate-700/50 hover:bg-slate-50 dark:hover:bg-slate-800/50">
                <td className="py-2.5 px-4 text-xs text-slate-500 dark:text-slate-400">{row.label}</td>
                {row.vals.map((v,i)=>(
                  <td key={i} className={`py-2.5 px-4 text-right font-semibold text-xs font-mono ${i===bi?'text-emerald-600 dark:text-emerald-400':v<0?'text-red-500':''}`}>
                    {row.fmt(v)}{i===bi&&<span className="ml-1">★</span>}
                  </td>
                ))}
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ── Variance Section ───────────────────────────────────────────────────────
function VarianceSection({ scenarios }) {
  const metrics = scenarios.map(s => calcMetrics(s));
  const pairs = [[0,1],[1,2],[0,2]].filter(([a,b])=>scenarios[a]&&scenarios[b]);
  const mkeys = [{key:'rev',label:'Revenue',fmt:currency},{key:'net',label:'Net Profit',fmt:currency},{key:'netMgn',label:'Net Margin',fmt:pct},{key:'ppu',label:'Profit/Unit',fmt:currency}];
  return (
    <div>
      <h3 className="font-semibold text-sm mb-3 flex items-center gap-2"><Icon name="activity" size={15} cls="text-slate-400" />Variance Analysis</h3>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
        {pairs.map(([ai,bi])=>{
          const mA=metrics[ai], mB=metrics[bi], sA=scenarios[ai], sB=scenarios[bi];
          const label=`${sA.subtitle||sA.name} vs ${sB.subtitle||sB.name}`;
          return (
            <Card key={label} cls="p-4">
              <div className="flex items-center gap-2 mb-3 text-xs font-semibold">
                <span className="w-2 h-2 rounded-full" style={{background:SCOL[ai]?.dot}} />
                <span className="text-slate-600 dark:text-slate-300 truncate">{label}</span>
                <span className="w-2 h-2 rounded-full" style={{background:SCOL[bi]?.dot}} />
              </div>
              <div className="space-y-2">
                {mkeys.map(({key,label:ml,fmt})=>{
                  const diff = mB[key]-mA[key];
                  const diffPct = mA[key]!==0 ? (diff/Math.abs(mA[key]))*100 : 0;
                  const pos = diff>0;
                  return (
                    <div key={key} className="flex items-center justify-between text-xs">
                      <span className="text-slate-500">{ml}</span>
                      <span className={`flex items-center gap-1 font-semibold ${pos?'text-emerald-600 dark:text-emerald-400':'text-red-500'}`}>
                        <Icon name={pos?'trendUp':'trendDown'} size={11} />
                        {fmt(Math.abs(diff))} ({Math.abs(diffPct).toFixed(0)}%)
                      </span>
                    </div>
                  );
                })}
              </div>
            </Card>
          );
        })}
      </div>
    </div>
  );
}

// ── AI Insight Panel ───────────────────────────────────────────────────────
function AIInsightPanel({ scenarios }) {
  const metrics = scenarios.map(s=>calcMetrics(s));
  const bestNet = metrics.reduce((b,m,i)=>m.net>b.val?{val:m.net,i}:b,{val:-Infinity,i:0});
  const bestMgn = metrics.reduce((b,m,i)=>m.netMgn>b.val?{val:m.netMgn,i}:b,{val:-Infinity,i:0});
  const lowestCost = metrics.reduce((b,m,i)=>m.tot<b.val?{val:m.tot,i}:b,{val:Infinity,i:0});
  const insights = [
    {icon:'trendUp',color:'text-emerald-500',title:'Profitability Leader',desc:`${scenarios[bestNet.i]?.subtitle||scenarios[bestNet.i]?.name} delivers the highest net profit at ${currency(bestNet.val)} (${pct(metrics[bestNet.i]?.netMgn)} margin). This scenario offers the strongest financial return.`},
    {icon:'zap',color:'text-amber-500',title:'Cost Efficiency',desc:`${scenarios[lowestCost.i]?.subtitle||scenarios[lowestCost.i]?.name} has the lowest total cost at ${currency(lowestCost.val)}, making it the safest choice if budget constraints are a primary concern.`},
    {icon:'activity',color:'text-indigo-500',title:'Margin Optimisation',desc:`${scenarios[bestMgn.i]?.subtitle||scenarios[bestMgn.i]?.name} achieves the best net margin at ${pct(metrics[bestMgn.i]?.netMgn)}. Higher margins indicate stronger pricing power and operational efficiency.`},
  ];
  return (
    <div className="p-5">
      <div className="flex items-center justify-between mb-4">
        <div className="flex items-center gap-2.5">
          <div className="w-8 h-8 bg-gradient-to-br from-indigo-500 to-violet-600 rounded-xl flex items-center justify-center">
            <Icon name="sparkle" size={15} cls="text-white" />
          </div>
          <div><p className="font-semibold text-sm">AI Scenario Insights</p><p className="text-xs text-slate-400">Auto-generated from your data</p></div>
        </div>
        <Badge color="amber">Preview</Badge>
      </div>
      <div className="space-y-3">
        {insights.map(ins=>(
          <div key={ins.title} className="flex gap-3 p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-100 dark:border-slate-700">
            <Icon name={ins.icon} size={16} cls={`${ins.color} mt-0.5 flex-shrink-0`} />
            <div><p className="text-sm font-medium mb-0.5">{ins.title}</p><p className="text-xs text-slate-400 leading-relaxed">{ins.desc}</p></div>
          </div>
        ))}
      </div>
      <div className="mt-4 p-3 rounded-xl bg-indigo-50 dark:bg-indigo-900/20 border border-indigo-100 dark:border-indigo-800 text-center">
        <p className="text-xs text-indigo-600 dark:text-indigo-400">Connect Claude API to unlock deeper analysis, risk modelling, and optimisation suggestions.</p>
      </div>
    </div>
  );
}

            <Icon name="search" size={40} cls="mx-auto text-slate-300 dark:text-slate-600 mb-3" />
            <p className="font-medium text-slate-500 mb-1">No packages found</p>
            <p className="text-sm text-slate-400">Try adjusting your search or filters.</p>
          </div>
        ) : (
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            {filtered.map(pkg=>(
              <PackageCard key={pkg.id} pkg={pkg}
                onToggleFav={()=>onToggleFav(pkg.id)}
                onUse={()=>onUse(pkg)}
                onClone={()=>onClone(pkg)} />
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ─── EXCEL IMPORT ────────────────────────────────────────────────────────────
function parseExcelToProject(workbook) {
  const sheetName = workbook.SheetNames[0];
  const ws = workbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

  // Find header row: row that contains price/qty keywords
  const priceKw = ['ราคา','price','unit','จำนวน','qty','amount','subtotal','รวม','กำไร','profit','cost'];
  let headerRow = -1;
  for (let i = 0; i < Math.min(10, rows.length); i++) {
    const cells = rows[i].map(c => String(c).toLowerCase());
    if (cells.some(c => priceKw.some(k => c.includes(k)))) { headerRow = i; break; }
  }
  if (headerRow < 0) headerRow = 0;

  const headers = rows[headerRow].map(c => String(c).trim());

  // Detect scenario groups: find columns named "ราคาขาย" or "selling" or "ราคา" repeating
  // A scenario block starts at columns that have a non-empty name in the row ABOVE headers
  const scenarioLabels = [];
  const titleRow = headerRow > 0 ? rows[headerRow - 1] : [];
  let lastLabel = 'Scenario A';
  headers.forEach((h, ci) => {
    const above = String(titleRow[ci] || '').trim();
    if (above) lastLabel = above;
    scenarioLabels[ci] = lastLabel;
  });

  // Find name column (first non-empty text col) and price columns per scenario
  const nameCol = headers.findIndex(h => {
    const lh = h.toLowerCase();
    return lh.includes('ราย') || lh.includes('name') || lh.includes('item') || lh === '';
  });
  const nc = nameCol >= 0 ? nameCol : 0;

  // Group columns by scenario label
  const scenMap = {};
  headers.forEach((h, ci) => {
    if (ci === nc) return;
    const lh = h.toLowerCase();
    const isPrice = priceKw.some(k => lh.includes(k));
    if (!isPrice) return;
    const sLabel = scenarioLabels[ci];
    if (!scenMap[sLabel]) scenMap[sLabel] = { label: sLabel, cols: [] };
    scenMap[sLabel].cols.push({ col: ci, hdr: h });
  });

  // Pick "selling price" col per scenario (prefer ราคาขาย / selling, fallback first price col)
  const scenarios = Object.values(scenMap).slice(0, 3).map((sc, idx) => {
    const sellCol = sc.cols.find(c => {
      const lh = c.hdr.toLowerCase();
      return lh.includes('ขาย') || lh.includes('sell') || lh.includes('net') || lh.includes('subtotal') || lh.includes('รวม');
    }) || sc.cols[0];
    const mkScenario = () => ({
      id: uid(), label: sc.label,
      units: 1, pricePerUnit: 0,
      assumptions: [],
      categories: [],
    });
    const s = mkScenario();

    // Walk data rows
    let currentCat = null;
    for (let ri = headerRow + 1; ri < rows.length; ri++) {
      const row = rows[ri];
      const name = String(row[nc] || '').trim();
      if (!name) continue;

      const rawVal = row[sellCol?.col];
      const val = parseFloat(String(rawVal).replace(/[^0-9.-]/g, '')) || 0;
      const hasNum = rawVal !== '' && rawVal !== null && rawVal !== undefined && !isNaN(parseFloat(rawVal));

      // Detect category row: name has text but price is 0/empty, or keyword in name
      const isCatKw = /รวม|subtotal|total|ยอด|สรุป|อาหาร|เครื่อง|venue|stage|ทีมงาน|ดอกไม้|ค่าใช้จ่าย|ไฟ|เสียง|transport|โปรแกรม|service/i.test(name);
      const isCat = (!hasNum && name.length > 1) || (isCatKw && val === 0);

      if (isCat) {
        currentCat = { id: uid(), name, isDirect: true, items: [] };
        s.categories.push(currentCat);
      } else if (hasNum) {
        if (!currentCat) {
          currentCat = { id: uid(), name: 'General', isDirect: true, items: [] };
          s.categories.push(currentCat);
        }
        currentCat.items.push({ id: uid(), name, value: val });
      }
    }

    // If no categories detected, flatten all items
    if (s.categories.length === 0) s.categories.push({ id: uid(), name: 'Imported Items', isDirect: true, items: [] });
    s.categories.forEach(c => { if (c.items.length === 0) c.items.push({ id: uid(), name: 'Item', value: 0 }); });

    return { ...s, _idx: idx };
  });

  return {
    id: uid(),
    name: sheetName || 'Imported Project',
    status: 'draft',
    updatedAt: new Date().toISOString(),
    scenarios: scenarios.length > 0 ? scenarios : [
      { id: uid(), label: 'Scenario A', units: 1, pricePerUnit: 0, assumptions: [],
        categories: [{ id: uid(), name: 'Imported Items', isDirect: true, items: [{ id: uid(), name: 'Item 1', value: 0 }] }] }
    ],
  };
}

function ExcelImportModal({ onClose, onImport }) {
  const [step, setStep] = React.useState('upload'); // upload | preview
  const [parsed, setParsed] = React.useState(null);
  const [projectName, setProjectName] = React.useState('');
  const [scenLabels, setScenLabels] = React.useState([]);
  const [dragging, setDragging] = React.useState(false);
  const [error, setError] = React.useState('');
  const [useAI, setUseAI] = React.useState(true);
  const [loading, setLoading] = React.useState(false);
  const [loadingMsg, setLoadingMsg] = React.useState('');
  const [apiKey, setApiKey] = React.useState(() => localStorage.getItem('anthropic_key') || '');
  const [showKey, setShowKey] = React.useState(false);

  const saveKey = (k) => { setApiKey(k); localStorage.setItem('anthropic_key', k); };

  // ── AI parsing via Claude API ─────────────────────────────────────────────
  const parseWithAI = async (workbook) => {
    const sheetName = workbook.SheetNames[0];
    const ws = workbook.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

    // Build a compact text table (max 120 rows, trim long cells)
    const tableText = rows.slice(0, 120).map(r =>
      r.map(c => String(c).slice(0, 60)).join('\t')
    ).join('\n');

    const prompt = `You are parsing a spreadsheet for an event/business scenario comparison app.

SPREADSHEET DATA (tab-separated):
\`\`\`
${tableText}
\`\`\`

TASK: Analyze this spreadsheet and extract scenario comparisons. Return ONLY a JSON object:

{
  "name": "<project name, use sheet name or first title found>",
  "scenarios": [
    {
      "label": "<scenario name e.g. ช่วงเช้า / Option A / Package 1>",
      "units": <number of units/pax if found, else 1>,
      "pricePerUnit": <price per unit if found, else 0>,
      "categories": [
        {
          "name": "<category name e.g. อาหารและเครื่องดื่ม / Catering / Venue>",
          "isDirect": true,
          "items": [
            { "name": "<line item name>", "value": <selling/net price as number> }
          ]
        }
      ]
    }
  ]
}

RULES:
1. Detect ALL scenarios (usually side-by-side column groups) — max 3
2. For each scenario, find its "selling price" or "net" or "ราคาขาย" or "รวม" column (NOT list/normal price)
3. Category rows = rows with a name but NO numeric value in that scenario's price column
4. Line item rows = rows with BOTH a name AND a numeric price value
5. Skip pure subtotal/total/summary rows
6. If Thai text: อาหาร=food, เครื่องดื่ม=drinks, เวที/Stage=stage, ดอกไม้=flowers, ทีมงาน=staff, ค่าใช้จ่าย=expenses
7. Return ONLY valid JSON — no markdown, no explanation`;

    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 4096,
        messages: [{ role: 'user', content: prompt }],
      }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `API error ${resp.status}`);
    }

    const data = await resp.json();
    const text = data.content[0].text.trim();
    const jsonMatch = text.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('AI returned invalid JSON');
    const aiData = JSON.parse(jsonMatch[0]);

    // Hydrate with IDs to match app schema
    return {
      id: uid(),
      name: aiData.name || sheetName,
      status: 'draft',
      updatedAt: new Date().toISOString(),
      scenarios: (aiData.scenarios || []).slice(0, 3).map(s => ({
        id: uid(),
        label: s.label || 'Scenario',
        units: Number(s.units) || 1,
        pricePerUnit: Number(s.pricePerUnit) || 0,
        assumptions: [],
        categories: (s.categories || []).map(c => ({
          id: uid(),
          name: c.name || 'Category',
          isDirect: c.isDirect !== false,
          items: (c.items || []).map(it => ({
            id: uid(),
            name: it.name || 'Item',
            value: Number(it.value) || 0,
          })),
        })).filter(c => c.items.length > 0),
      })).filter(s => s.categories.length > 0),
    };
  };

  // ── Process uploaded file ─────────────────────────────────────────────────
  const processFile = async (file) => {
    if (!file) return;
    if (!file.name.match(/\.(xlsx|xls|csv)$/i)) { setError('รองรับเฉพาะไฟล์ .xlsx, .xls, .csv'); return; }
    setError('');
    setLoading(true);

    const arrayBuf = await file.arrayBuffer();
    const wb = XLSX.read(arrayBuf, { type: 'array' });

    let proj;
    if (useAI && apiKey.trim()) {
      try {
        setLoadingMsg('กำลังส่งข้อมูลให้ AI วิเคราะห์...');
        proj = await parseWithAI(wb);
      } catch (err) {
        setLoading(false);
        setError('AI Error: ' + err.message + ' — ลองใช้ Auto Parse แทน');
        return;
      }
    } else {
      setLoadingMsg('กำลังวิเคราะห์โครงสร้าง...');
      await new Promise(r => setTimeout(r, 100));
      proj = parseExcelToProject(wb);
    }

    setParsed(proj);
    setProjectName(proj.name);
    setScenLabels(proj.scenarios.map(s => s.label));
    setLoading(false);
    setStep('preview');
  };

  const handleDrop = (e) => { e.preventDefault(); setDragging(false); processFile(e.dataTransfer.files[0]); };

  const handleImport = () => {
    const proj = {
      ...parsed,
      name: projectName,
      scenarios: parsed.scenarios.map((s, i) => ({ ...s, label: scenLabels[i] || s.label })),
    };
    onImport(proj);
    onClose();
  };

  const totalItems = parsed ? parsed.scenarios.reduce((sum, s) => sum + s.categories.reduce((cs, c) => cs + c.items.length, 0), 0) : 0;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
      <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col">
        {/* Header */}
        <div className="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-700">
          <h2 className="text-lg font-semibold flex items-center gap-2">
            <Icon name="upload" size={20} cls="text-indigo-500" /> Import Excel
          </h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
            <Icon name="x" size={20} />
          </button>
        </div>

        <div className="flex-1 overflow-y-auto p-6">
          {/* Loading overlay */}
          {loading && (
            <div className="flex flex-col items-center justify-center py-16 gap-4">
              <div className="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin" />
              <p className="text-slate-600 dark:text-slate-300 font-medium">{loadingMsg}</p>
              {useAI && <p className="text-xs text-slate-400">Claude กำลังอ่านโครงสร้าง Excel...</p>}
            </div>
          )}

          {!loading && step === 'upload' && (
            <div className="space-y-5">
              {/* AI toggle */}
              <div className="p-4 bg-indigo-50 dark:bg-indigo-900/20 rounded-xl border border-indigo-200 dark:border-indigo-700">
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-lg">✨</span>
                    <span className="font-semibold text-indigo-700 dark:text-indigo-300 text-sm">AI Parse (แนะนำ)</span>
                    <Badge color="indigo">Claude Haiku</Badge>
                  </div>
                  <button onClick={() => setUseAI(u => !u)}
                    className={`relative w-11 h-6 rounded-full transition-colors ${useAI ? 'bg-indigo-600' : 'bg-slate-300 dark:bg-slate-600'}`}>
                    <span className={`absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform ${useAI ? 'translate-x-5' : ''}`} />
                  </button>
                </div>
                {useAI && (
                  <div>
                    <label className="block text-xs font-medium text-indigo-700 dark:text-indigo-300 mb-1">Anthropic API Key</label>
                    <div className="flex gap-2">
                      <input
                        type={showKey ? 'text' : 'password'}
                        value={apiKey}
                        onChange={e => saveKey(e.target.value)}
                        placeholder="sk-ant-..."
                        className="flex-1 px-3 py-1.5 text-sm rounded-lg border border-indigo-300 dark:border-indigo-600 bg-white dark:bg-slate-700 focus:ring-2 focus:ring-indigo-400 outline-none"
                      />
                      <button onClick={() => setShowKey(v => !v)}
                        className="px-3 py-1.5 text-xs bg-white dark:bg-slate-700 border border-indigo-300 dark:border-indigo-600 rounded-lg text-slate-500 hover:text-slate-700">
                        {showKey ? 'ซ่อน' : 'แสดง'}
                      </button>
                    </div>
                    <p className="text-xs text-indigo-500 mt-1">เก็บใน localStorage เท่านั้น ไม่ส่งไปที่อื่น</p>
                  </div>
                )}
                {!useAI && <p className="text-xs text-slate-500">ใช้ rule-based parsing (อาจไม่แม่นยำกับ Excel ที่ซับซ้อน)</p>}
              </div>

              {/* Drop zone */}
              <div
                onDragOver={e => { e.preventDefault(); setDragging(true); }}
                onDragLeave={() => setDragging(false)}
                onDrop={handleDrop}
                className={`border-2 border-dashed rounded-xl p-10 text-center transition-colors cursor-pointer
                  ${dragging ? 'border-indigo-400 bg-indigo-50 dark:bg-indigo-900/20' : 'border-slate-300 dark:border-slate-600 hover:border-indigo-400'}`}
                onClick={() => document.getElementById('xl-file-input').click()}
              >

                <p className="text-sm text-slate-400">รองรับ .xlsx, .xls, .csv</p>

          )}

          {!loading && step === 'preview' && parsed && (
            <div className="space-y-5">
              <div className="flex items-center gap-2 text-sm text-emerald-600 dark:text-emerald-400 font-medium">
                <span>✓</span> {useAI && apiKey ? 'AI วิเคราะห์สำเร็จ' : 'Auto-parse สำเร็จ'}
                <span className="text-slate-400 font-normal">— {parsed.scenarios.length} scenario · {totalItems} items</span>
              </div>

              <div>
                <label className="block text-sm font-medium text-slate-700 dark:text-slate-200 mb-1">ชื่อ Project</label>

                  className="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm focus:ring-2 focus:ring-indigo-400 outline-none" />
              </div>

              <div className="space-y-3">

                  <div key={s.id} className="border border-slate-200 dark:border-slate-600 rounded-xl overflow-hidden">

                      <span className="w-3 h-3 rounded-full flex-shrink-0" style={{ background: ['#6366f1','#0ea5e9','#8b5cf6'][i] || '#94a3b8' }} />
                      <input value={scenLabels[i] || ''} onChange={e => setScenLabels(sl => sl.map((l,j) => j===i ? e.target.value : l))}
                        className="flex-1 bg-transparent text-sm font-semibold text-slate-800 outline-none border-b border-transparent focus:border-indigo-400" />
                      <span className="text-xs text-slate-500">{s.categories.reduce((sum,c) => sum+c.items.length,0)} items</span>
                    </div>
                    <div className="px-4 py-2 max-h-52 overflow-y-auto">
                      {s.categories.map(cat => (
                        <div key={cat.id} className="mb-2">
                          <p className="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-1">{cat.name}</p>
                          {cat.items.slice(0, 6).map(it => (
                            <div key={it.id} className="flex justify-between text-xs py-0.5 text-slate-600 dark:text-slate-300">
                              <span className="truncate mr-4">{it.name}</span>
                              <span className="flex-shrink-0 font-mono">{currency(it.value)}</span>
                            </div>
                          ))}
                          {cat.items.length > 6 && <p className="text-xs text-slate-400 italic">+{cat.items.length-6} more...</p>}
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>

        {/* Footer */}
        {!loading && (
          <div className="px-6 py-4 border-t border-slate-200 dark:border-slate-700 flex justify-between">
            {step === 'preview' ? (
              <>
                <Btn v="ghost" onClick={() => setStep('upload')}>← เลือกไฟล์ใหม่</Btn>
                <Btn v="primary" onClick={handleImport}><Icon name="upload" size={15} />Import เป็น Project ใหม่</Btn>
              </>
            ) : (
              <Btn v="ghost" onClick={onClose}>ยกเลิก</Btn>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ─── APP ROOT ────────────────────────────────────────────────────────────────
function App() {
  const [projects, setProjects]             = React.useState(INIT_PROJECTS);
  const [packages, setPackages]             = React.useState(INIT_PACKAGES);
  const [screen, setScreen]                 = React.useState('dashboard');
  const [activeProjectId, setActiveProjectId] = React.useState(null);
  const [darkMode, setDarkMode]             = React.useState(false);
  const [toast, setToast]                   = React.useState(null);
  const [saveModal, setSaveModal]           = React.useState(null);
  const [showImport, setShowImport]         = React.useState(false);

  React.useEffect(() => {
    document.documentElement.classList.toggle('dark', darkMode);
  }, [darkMode]);

  const showToast = (msg, type='success') => {
    setToast({ msg, type, id: uid() });
    setTimeout(() => setToast(null), 3200);
  };

  // ── Project helpers ──────────────────────────────────────────────────────
  const activeProject = projects.find(p => p.id === activeProjectId) || null;

  const openProject = (id) => {
    setActiveProjectId(id);
    setScreen('compare');
  };

  const createProject = () => {
    const mkScenario = (label) => ({
      id: uid(), label,
      units: 0, pricePerUnit: 0,
      assumptions: [],
      categories: [
        { id: uid(), name: 'Direct Costs', isDirect: true,
          items: [{ id: uid(), name: 'Item 1', value: 0 }] },
        { id: uid(), name: 'Overhead',     isDirect: false,
          items: [{ id: uid(), name: 'Item 1', value: 0 }] },
      ],
    });
    const proj = {
      id: uid(),
      name: 'New Project',
      status: 'draft',
      updatedAt: new Date().toISOString(),
      scenarios: [mkScenario('Scenario A'), mkScenario('Scenario B'), mkScenario('Scenario C')],
    };
    setProjects(prev => [proj, ...prev]);
    openProject(proj.id);
  };

  // ── Generic project field update ────────────────────────────────────────
  const updProject = (id, field, value) => {
    setProjects(prev => prev.map(p =>
      p.id !== id ? p : { ...p, [field]: value, updatedAt: new Date().toISOString() }
    ));
  };

  const saveDraft = (id) => {
    setProjects(prev => prev.map(p =>
      p.id !== id ? p : { ...p, status: 'draft', updatedAt: new Date().toISOString() }
    ));
    showToast('Draft saved');
  };

  // ── Scenario-level updates ───────────────────────────────────────────────
  const updScenario = (projectId, scenarioId, field, value) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      return {
        ...p,
        updatedAt: new Date().toISOString(),
        scenarios: p.scenarios.map(s =>
          s.id !== scenarioId ? s : { ...s, [field]: value }
        ),
      };
    }));
  };

  // ── Assumption updates ───────────────────────────────────────────────────
  const updAssumption = (projectId, scenarioId, asmIdx, field, value) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      return {
        ...p,
        scenarios: p.scenarios.map(s => {
          if (s.id !== scenarioId) return s;
          const assumptions = s.assumptions.map((a, i) =>
            i !== asmIdx ? a : { ...a, [field]: value }
          );
          return { ...s, assumptions };
        }),
      };
    }));
  };

  const addAssumption = (projectId, scenarioId) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      return {
        ...p,
        scenarios: p.scenarios.map(s => {
          if (s.id !== scenarioId) return s;
          return { ...s, assumptions: [...(s.assumptions||[]), { id: uid(), key: 'Assumption', value: '' }] };
        }),
      };
    }));
  };

  const remAssumption = (projectId, scenarioId, asmIdx) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      return {
        ...p,
        scenarios: p.scenarios.map(s => {
          if (s.id !== scenarioId) return s;
          return { ...s, assumptions: s.assumptions.filter((_,i) => i !== asmIdx) };
        }),
      };
    }));
  };

  // ── Category updates ─────────────────────────────────────────────────────
  const addCat = (projectId, scenarioId) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      return {
        ...p,
        scenarios: p.scenarios.map(s => {
          if (s.id !== scenarioId) return s;
          const newCat = { id: uid(), name: 'New Category', isDirect: false, items: [{ id: uid(), name: 'Item 1', value: 0 }] };
          return { ...s, categories: [...s.categories, newCat] };
        }),
      };
    }));
  };

  const remCat = (projectId, scenarioId, catId) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      return {
        ...p,
        scenarios: p.scenarios.map(s => {
          if (s.id !== scenarioId) return s;
          return { ...s, categories: s.categories.filter(c => c.id !== catId) };
        }),
      };
    }));
  };

  const updCat = (projectId, scenarioId, catId, field, value) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      return {
        ...p,
        scenarios: p.scenarios.map(s => {
          if (s.id !== scenarioId) return s;
          return { ...s, categories: s.categories.map(c => c.id !== catId ? c : { ...c, [field]: value }) };
        }),
      };
    }));
  };

  // ── Line-item updates ────────────────────────────────────────────────────
  const addItem = (projectId, scenarioId, catId) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      return {
        ...p,
        scenarios: p.scenarios.map(s => {
          if (s.id !== scenarioId) return s;
          return {
            ...s,
            categories: s.categories.map(c => {
              if (c.id !== catId) return c;
              return { ...c, items: [...c.items, { id: uid(), name: 'New Item', value: 0 }] };
            }),
          };
        }),
      };
    }));
  };

  const remItem = (projectId, scenarioId, catId, itemId) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      return {
        ...p,
        scenarios: p.scenarios.map(s => {
          if (s.id !== scenarioId) return s;
          return {
            ...s,
            categories: s.categories.map(c => {
              if (c.id !== catId) return c;
              return { ...c, items: c.items.filter(it => it.id !== itemId) };
            }),
          };
        }),
      };
    }));
  };

  const updItem = (projectId, scenarioId, catId, itemId, field, value) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      return {
        ...p,
        scenarios: p.scenarios.map(s => {
          if (s.id !== scenarioId) return s;
          return {
            ...s,
            categories: s.categories.map(c => {
              if (c.id !== catId) return c;
              return { ...c, items: c.items.map(it => it.id !== itemId ? it : { ...it, [field]: value }) };
            }),
          };
        }),
      };
    }));
  };

  // ── Package handlers ──────────────────────────────────────────────────────
  const handleSavePackage = (scenario) => setSaveModal(scenario);

  const handleSavePackageSubmit = (form) => {
    const scenario = saveModal;
    const m = calcMetrics(scenario);
    const pkg = {
      id: uid(),
      name: form.name,
      category: form.category,
      type: form.type,
      description: form.description,
      tags: form.tags.split(',').map(t=>t.trim()).filter(Boolean),
      favorite: false,
      metrics: { revenue: m.rev, cost: m.tot, profit: m.net, margin: m.netMgn },
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      scenarios: form.includeScenario ? [scenario] : [],
      assumptions: form.includeAssumptions ? scenario.assumptions : [],
    };
    setPackages(prev => [pkg, ...prev]);
    setSaveModal(null);
    showToast(`"${form.name}" saved to Package Library`);
  };

  const toggleFavPackage = (pkgId) => {
    setPackages(prev => prev.map(p => p.id !== pkgId ? p : { ...p, favorite: !p.favorite }));
  };

  const usePackage = (pkg) => {
    showToast(`Package "${pkg.name}" ready to apply`);
  };

  const clonePackage = (pkg) => {
    const cloned = { ...pkg, id: uid(), name: pkg.name + ' (Copy)', favorite: false, createdAt: new Date().toISOString() };
    setPackages(prev => [cloned, ...prev]);
    showToast(`Cloned "${pkg.name}"`);
  };

  // ── Handlers bundle ───────────────────────────────────────────────────────
  const handlers = {
    updProject,
    saveDraft,
    updScenario:    (sid, f, v)       => activeProject && updScenario(activeProject.id, sid, f, v),
    updAssumption:  (sid, i, f, v)    => activeProject && updAssumption(activeProject.id, sid, i, f, v),
    addAssumption:  (sid)             => activeProject && addAssumption(activeProject.id, sid),
    remAssumption:  (sid, i)          => activeProject && remAssumption(activeProject.id, sid, i),
    addCat:         (sid)             => activeProject && addCat(activeProject.id, sid),
    remCat:         (sid, cid)        => activeProject && remCat(activeProject.id, sid, cid),
    updCat:         (sid, cid, f, v)  => activeProject && updCat(activeProject.id, sid, cid, f, v),
    addItem:        (sid, cid)        => activeProject && addItem(activeProject.id, sid, cid),
    remItem:        (sid, cid, iid)   => activeProject && remItem(activeProject.id, sid, cid, iid),
    updItem:        (sid, cid, iid, f, v) => activeProject && updItem(activeProject.id, sid, cid, iid, f, v),
  };

  // ── Render ────────────────────────────────────────────────────────────────
  return (
    <div className="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-300">
      {/* Global nav */}
      <header className="sticky top-0 z-40 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-sm">
        <div className="max-w-7xl mx-auto px-4 h-14 flex items-center gap-3">
          <button onClick={()=>setScreen('dashboard')} className="flex items-center gap-2 font-bold text-lg text-indigo-600 dark:text-indigo-400">
            <Icon name="zap" size={20} cls="text-indigo-500" />
            <span className="hidden sm:inline">Offer Builder</span>
          </button>
          <div className="flex-1" />
          {/* Nav tabs */}
          {['dashboard','compare','packages'].map(s => (
            <button key={s}
              onClick={() => { if(s==='compare' && !activeProjectId && projects.length>0) setActiveProjectId(projects[0].id); setScreen(s); }}
              className={`px-3 py-1.5 rounded-lg text-sm font-medium transition-colors ${screen===s
                ? 'bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400'
                : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}>
              {s==='dashboard'?'Dashboard':s==='compare'?'Compare':'Library'}
            </button>
          ))}
          <button onClick={()=>setDarkMode(d=>!d)}
            className="ml-1 p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
            title="Toggle dark mode">
            <Icon name={darkMode?'sun':'moon'} size={18} />
          </button>
        </div>
      </header>

      {/* Screen router */}
      <main className="max-w-7xl mx-auto px-4 py-6">
        {screen === 'dashboard' && (
          <Dashboard
            projects={projects}
            packages={packages}
            onOpenProject={openProject}
            onNewProject={createProject}
            onImportExcel={() => setShowImport(true)}
            onToggleFav={toggleFavPackage}
          />
        )}
        {screen === 'compare' && activeProject && (
          <ScenarioCompare
            project={activeProject}
            handlers={handlers}
            onSavePackage={handleSavePackage}
          />
        )}
        {screen === 'compare' && !activeProject && (
          <div className="text-center py-24">
            <Icon name="folder" size={48} cls="mx-auto text-slate-300 dark:text-slate-600 mb-4" />
            <p className="text-xl font-semibold text-slate-500 mb-2">No project selected</p>
            <p className="text-slate-400 mb-6">Open a project from the dashboard or create a new one.</p>
            <Btn variant="primary" onClick={()=>setScreen('dashboard')}>Go to Dashboard</Btn>
          </div>
        )}
        {screen === 'packages' && (
          <PackageLibrary
            packages={packages}
            onToggleFav={toggleFavPackage}
            onUse={usePackage}
            onClone={clonePackage}
          />
        )}
      </main>

      {/* Save Package Modal */}
      {saveModal && (
        <SavePackageModal
          scenario={saveModal}
          onClose={()=>setSaveModal(null)}
          onSave={handleSavePackageSubmit}
        />
      )}

      {/* Excel Import Modal */}
      {showImport && (
        <ExcelImportModal
          onClose={() => setShowImport(false)}
          onImport={(proj) => {
            setProjects(prev => [proj, ...prev]);
            openProject(proj.id);
            showToast(`นำเข้า "${proj.name}" สำเร็จ — ${proj.scenarios.length} scenarios`);
          }}
        />
      )}

      {/* Toast */}
      {toast && <Toast key={toast.id} msg={toast.msg} type={toast.type} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
