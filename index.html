// ─── EXCEL IMPORT ────────────────────────────────────────────────────────────
function parseExcelToProject(workbook) {
  const sheetName = workbook.SheetNames[0];
  const ws = workbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

  // Find header row: row that contains price/qty keywords
  const priceKw = ['ราคา','price','unit','จำนวน','qty','amount','subtotal','รวม','กำไร','profit','cost'];
  let headerRow = -1;
  for (let i = 0; i < Math.min(10, rows.length); i++) {
    const cells = rows[i].map(c => String(c).toLowerCase());
    if (cells.some(c => priceKw.some(k => c.includes(k)))) { headerRow = i; break; }
  }
  if (headerRow < 0) headerRow = 0;

  const headers = rows[headerRow].map(c => String(c).trim());

  // Detect scenario groups: find columns named "ราคาขาย" or "selling" or "ราคา" repeating
  // A scenario block starts at columns that have a non-empty name in the row ABOVE headers
  const scenarioLabels = [];
  const titleRow = headerRow > 0 ? rows[headerRow - 1] : [];
  let lastLabel = 'Scenario A';
  headers.forEach((h, ci) => {
    const above = String(titleRow[ci] || '').trim();
    if (above) lastLabel = above;
    scenarioLabels[ci] = lastLabel;
  });

  // Find name column (first non-empty text col) and price columns per scenario
  const nameCol = headers.findIndex(h => {
    const lh = h.toLowerCase();
    return lh.includes('ราย') || lh.includes('name') || lh.includes('item') || lh === '';
  });
  const nc = nameCol >= 0 ? nameCol : 0;

  // Group columns by scenario label
  const scenMap = {};
  headers.forEach((h, ci) => {
    if (ci === nc) return;
    const lh = h.toLowerCase();
    const isPrice = priceKw.some(k => lh.includes(k));
    if (!isPrice) return;
    const sLabel = scenarioLabels[ci];
    if (!scenMap[sLabel]) scenMap[sLabel] = { label: sLabel, cols: [] };
    scenMap[sLabel].cols.push({ col: ci, hdr: h });
  });

  // Pick "selling price" col per scenario (prefer ราคาขาย / selling, fallback first price col)
  const scenarios = Object.values(scenMap).slice(0, 3).map((sc, idx) => {
    const sellCol = sc.cols.find(c => {
      const lh = c.hdr.toLowerCase();
      return lh.includes('ขาย') || lh.includes('sell') || lh.includes('net') || lh.includes('subtotal') || lh.includes('รวม');
    }) || sc.cols[0];
    const mkScenario = () => ({
      id: uid(), label: sc.label,
      units: 1, pricePerUnit: 0,
      assumptions: [],
      categories: [],
    });
    const s = mkScenario();

    // Walk data rows
    let currentCat = null;
    for (let ri = headerRow + 1; ri < rows.length; ri++) {
      const row = rows[ri];
      const name = String(row[nc] || '').trim();
      if (!name) continue;

      const rawVal = row[sellCol?.col];
      const val = parseFloat(String(rawVal).replace(/[^0-9.-]/g, '')) || 0;
      const hasNum = rawVal !== '' && rawVal !== null && rawVal !== undefined && !isNaN(parseFloat(rawVal));

      // Detect category row: name has text but price is 0/empty, or keyword in name
      const isCatKw = /รวม|subtotal|total|ยอด|สรุป|อาหาร|เครื่อง|venue|stage|ทีมงาน|ดอกไม้|ค่าใช้จ่าย|ไฟ|เสียง|transport|โปรแกรม|service/i.test(name);
      const isCat = (!hasNum && name.length > 1) || (isCatKw && val === 0);

      if (isCat) {
        currentCat = { id: uid(), name, isRevenue: false, isDirectCost: true, items: [] };
        s.categories.push(currentCat);
      } else if (hasNum) {
        if (!currentCat) {
          currentCat = { id: uid(), name: 'General', isDirect: true, items: [] };
          s.categories.push(currentCat);
        }
        currentCat.items.push({ id: uid(), name, value: val });
      }
    }

    // If no categories detected, flatten all items
    if (s.categories.length === 0) s.categories.push({ id: uid(), name: 'Imported Items', isDirect: true, items: [] });
    s.categories.forEach(c => { if (c.items.length === 0) c.items.push({ id: uid(), name: 'Item', value: 0 }); });

    return { ...s, _idx: idx };
  });

  return {
    id: uid(),
    name: sheetName || 'Imported Project',
    status: 'draft',
    currency: 'THB',
    isFavorite: false,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    scenarios: scenarios.length > 0 ? scenarios : [
      { id: uid(), label: 'Scenario A', units: 1, pricePerUnit: 0, assumptions: [],
        categories: [{ id: uid(), name: 'Imported Items', isRevenue: false, isDirectCost: true, items: [{ id: uid(), name: 'Item 1', value: 0 }] }] }
    ],
  };
}

function ExcelImportModal({ onClose, onImport }) {
  const [step, setStep] = React.useState('upload'); // upload | preview
  const [parsed, setParsed] = React.useState(null);
  const [projectName, setProjectName] = React.useState('');
  const [scenLabels, setScenLabels] = React.useState([]);
  const [dragging, setDragging] = React.useState(false);
  const [error, setError] = React.useState('');
  const [useAI, setUseAI] = React.useState(true);
  const [loading, setLoading] = React.useState(false);
  const [loadingMsg, setLoadingMsg] = React.useState('');
  const [apiKey, setApiKey] = React.useState(() => localStorage.getItem('anthropic_key') || '');
  const [showKey, setShowKey] = React.useState(false);

  const saveKey = (k) => { setApiKey(k); localStorage.setItem('anthropic_key', k); };

  // ── AI parsing via Claude API ─────────────────────────────────────────────
  // JSON repair: try to salvage truncated/malformed AI output
  const repairJSON = (text) => {
    // Strip markdown fences
    text = text.replace(/```json\s*/gi, '').replace(/```\s*/g, '').trim();
    // Try straight parse first
    try { return JSON.parse(text); } catch(_) {}
    // Find first {
    const start = text.indexOf('{');
    if (start < 0) throw new Error('No JSON object in response');
    let s = text.slice(start);
    // Walk characters to find last fully-closed position at depth 0
    let depth = 0, inStr = false, esc = false, lastClose = -1;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (esc) { esc = false; continue; }
      if (c === '\\' && inStr) { esc = true; continue; }
      if (c === '"') { inStr = !inStr; continue; }
      if (inStr) continue;
      if (c === '{' || c === '[') depth++;
      else if (c === '}' || c === ']') { depth--; if (depth === 0) lastClose = i; }
    }
    // If we have a full valid segment, use it
    if (lastClose > 0) {
      try { return JSON.parse(s.slice(0, lastClose + 1)); } catch(_) {}
    }
    // Try to close open structures by appending closing brackets
    // Strip trailing incomplete token (unfinished string, trailing comma)
    s = s.replace(/,\s*$/, '').replace(/"[^"]*$/, '');
    const closers = [']}]}', ']}', '}]}', '}}', '}]}}', '}}]}'];
    for (const tail of closers) {
      try { return JSON.parse(s + tail); } catch(_) {}
    }
    throw new Error('Could not parse or repair AI response JSON');
  };

  const parseWithAI = async (workbook) => {
    const sheetName = workbook.SheetNames[0];
    const ws = workbook.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

    // Send up to 200 rows, trim cells to 80 chars, skip fully-empty rows
    const tableText = rows
      .slice(0, 200)
      .filter(r => r.some(c => String(c).trim() !== ''))
      .map(r => r.map(c => String(c).trim().slice(0, 80)).join('\t'))
      .join('\n');

    const prompt = `You are parsing a Thai business/event quotation spreadsheet for a scenario comparison app.

SPREADSHEET (tab-separated, may have 3 scenario columns side-by-side):
\`\`\`
${tableText}
\`\`\`

TASK: Extract up to 3 scenarios. Return ONLY compact valid JSON — no explanation, no markdown.

JSON SCHEMA:
{"name":"<project name>","scenarios":[{"label":"<scenario name>","subtitle":"","units":1,"revenuePerUnit":0,"categories":[{"name":"<category>","isRevenue":<true|false>,"items":[{"name":"<item>","qty":<num>,"unitPrice":<num>,"unitCost":<num or omit>}]}]}]}

RULES:
1. MULTIPLE SCENARIOS: If columns repeat (e.g. ช่วงเช้า / ช่วงเย็น / เช้า+เย็น), extract each as a separate scenario with its own column values
2. isRevenue=true → ยอดขาย/ราคาขาย/รายรับ (income). isRevenue=false → ต้นทุน/ค่าใช้จ่าย/cost (expense)
3. "qty" × "unitPrice" = selling total. "unitCost" = cost per unit (if there's a separate cost column)
4. Skip subtotal/total/grand-total/summary rows. Skip rows with no price.
5. If a row has BOTH a ราคาขาย and a ต้นทุน column → unitPrice=ราคาขาย, unitCost=ต้นทุน
6. Category row = row with label but no number. Item row = row with label + number.
7. Thai vocab: อาหาร=food, เครื่องดื่ม=drinks, เวที=stage, ดอกไม้=flowers, ทีมงาน=staff, บริการ=service, ค่าใช้จ่าย=expenses, รวม=total, จำนวน=quantity
8. COMPACT output: omit unitCost when 0, omit subtitle when empty
9. Keep item names short (≤50 chars). Max 5 scenarios, max 10 categories each, max 30 items each.
10. Return ONLY valid JSON starting with {`;

    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 8192,
        messages: [{ role: 'user', content: prompt }],
      }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `API error ${resp.status}`);
    }

    const data = await resp.json();
    const rawText = data.content[0].text.trim();
    let aiData;
    try {
      aiData = repairJSON(rawText);
    } catch (parseErr) {
      throw new Error(`JSON repair failed: ${parseErr.message} (response length: ${rawText.length} chars)`);
    }

    // Hydrate with IDs to match app schema
    const scenarios = (aiData.scenarios || []).slice(0, 5).map(s => ({
      id: uid(),
      label: s.label || 'Scenario',
      name: s.label || 'Scenario',
      subtitle: s.subtitle || '',
      units: Number(s.units) || 1,
      revenuePerUnit: Number(s.revenuePerUnit || s.pricePerUnit) || 0,
      assumptions: [],
      categories: (s.categories || []).map(c => ({
        id: uid(),
        name: c.name || 'Category',
        isRevenue: c.isRevenue === true,
        isDirectCost: c.isDirect !== false,
        items: (c.items || []).map(it => {
          const qty = Number(it.qty) || 1;
          const unitPrice = Number(it.unitPrice ?? it.value) || 0;
          const unitCost = (it.unitCost != null && it.unitCost !== '') ? Number(it.unitCost) : undefined;
          return {
            id: uid(),
            name: it.name || 'Item',
            qty,
            unitPrice,
            value: qty * unitPrice,
            ...(unitCost !== undefined ? { unitCost } : {}),
          };
        }),
      })).filter(c => c.items.length > 0),
    }));

    const comparisons = [];
    for (let i = 0; i < scenarios.length - 1; i++) {
      comparisons.push({ id: uid(), leftId: scenarios[i].id, rightId: scenarios[i + 1].id });
    }
    if (comparisons.length === 0 && scenarios.length > 0) {
      const blank = { id: uid(), label: 'Scenario B', name: 'Scenario B', subtitle: '', units: 1, revenuePerUnit: 0, assumptions: [], categories: [] };
      scenarios.push(blank);
      comparisons.push({ id: uid(), leftId: scenarios[0].id, rightId: blank.id });
    }

    return {
      id: uid(),
      name: aiData.name || sheetName,
      status: 'draft',
      currency: 'THB',
      isFavorite: false,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      comparisons,
      scenarios,
    };
  };

  // ── Process uploaded file ─────────────────────────────────────────────────
  const processFile = async (file) => {
    if (!file) return;
    if (!file.name.match(/\.(xlsx|xls|csv)$/i)) { setError('รองรับเฉพาะไฟล์ .xlsx, .xls, .csv'); return; }
    setError('');
    setLoading(true);

    const arrayBuf = await file.arrayBuffer();
    const wb = XLSX.read(arrayBuf, { type: 'array' });

    let proj;
    if (useAI && apiKey.trim()) {
      try {
        setLoadingMsg('กำลังส่งข้อมูลให้ AI วิเคราะห์ (อาจใช้เวลา 10-20 วินาที)...');
        proj = await parseWithAI(wb);
      } catch (err) {
        setLoading(false);
        const hint = err.message.includes('JSON repair failed')
          ? 'AI ส่ง JSON ไม่สมบูรณ์ — ไฟล์อาจซับซ้อนเกินไป ลองเปิด AI Parse แบบ Auto Parse แทน หรือลดจำนวน row'
          : err.message.includes('401') ? 'API Key ไม่ถูกต้อง กรุณาตรวจสอบ'
          : err.message.includes('529') || err.message.includes('overloaded') ? 'Claude API busy — รอสักครู่แล้วลองใหม่'
          : err.message;
        setError(`AI Error: ${hint}`);
        return;
      }
    } else {
      setLoadingMsg('กำลังวิเคราะห์โครงสร้าง...');
      await new Promise(r => setTimeout(r, 100));
      proj = parseExcelToProject(wb);
    }

    setParsed(proj);
    setProjectName(proj.name);
    setScenLabels(proj.scenarios.map(s => s.label));
    setLoading(false);
    setStep('preview');
  };

  const handleDrop = (e) => { e.preventDefault(); setDragging(false); processFile(e.dataTransfer.files[0]); };

  const handleImport = () => {
    const proj = {
      ...parsed,
      name: projectName,
      scenarios: parsed.scenarios.map((s, i) => ({ ...s, label: scenLabels[i] || s.label })),
    };
    onImport(proj);
    onClose();
  };

  const totalItems = parsed ? parsed.scenarios.reduce((sum, s) => sum + s.categories.reduce((cs, c) => cs + c.items.length, 0), 0) : 0;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
      <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col">
        {/* Header */}
        <div className="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-700">
          <h2 className="text-lg font-semibold flex items-center gap-2">
            <Icon name="upload" size={20} cls="text-indigo-500" /> Import Excel
          </h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
            <Icon name="x" size={20} />
          </button>
        </div>

        <div className="flex-1 overflow-y-auto p-6">
          {/* Loading overlay */}
          {loading && (
            <div className="flex flex-col items-center justify-center py-16 gap-4">
              <div className="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin" />
              <p className="text-slate-600 dark:text-slate-300 font-medium">{loadingMsg}</p>
              {useAI && <p className="text-xs text-slate-400">Claude กำลังอ่านโครงสร้าง Excel...</p>}
            </div>
          )}

          {!loading && step === 'upload' && (
            <div className="space-y-5">
              {/* AI toggle */}
              <div className="p-4 bg-indigo-50 dark:bg-indigo-900/20 rounded-xl border border-indigo-200 dark:border-indigo-700">
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-lg">✨</span>
                    <span className="font-semibold text-indigo-700 dark:text-indigo-300 text-sm">AI Parse (แนะนำ)</span>
                    <Badge color="indigo">Claude Haiku</Badge>
                  </div>
                  <button onClick={() => setUseAI(u => !u)}
                    className={`relative w-11 h-6 rounded-full transition-colors ${useAI ? 'bg-indigo-600' : 'bg-slate-300 dark:bg-slate-600'}`}>
                    <span className={`absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform ${useAI ? 'translate-x-5' : ''}`} />
                  </button>
                </div>
                {useAI && (
                  <div>
                    <label className="block text-xs font-medium text-indigo-700 dark:text-indigo-300 mb-1">Anthropic API Key</label>
                    <div className="flex gap-2">
                      <input
                        type={showKey ? 'text' : 'password'}
                        value={apiKey}
                        onChange={e => saveKey(e.target.value)}
                        placeholder="sk-ant-..."
                        className="flex-1 px-3 py-1.5 text-sm rounded-lg border border-indigo-300 dark:border-indigo-600 bg-white dark:bg-slate-700 focus:ring-2 focus:ring-indigo-400 outline-none"
                      />
                      <button onClick={() => setShowKey(v => !v)}
                        className="px-3 py-1.5 text-xs bg-white dark:bg-slate-700 border border-indigo-300 dark:border-indigo-600 rounded-lg text-slate-500 hover:text-slate-700">
                        {showKey ? 'ซ่อน' : 'แสดง'}
                      </button>
                    </div>
                    <p className="text-xs text-indigo-500 mt-1">เก็บใน localStorage เท่านั้น ไม่ส่งไปที่อื่น</p>
                  </div>
                )}
                {!useAI && <p className="text-xs text-slate-500">ใช้ rule-based parsing (อาจไม่แม่นยำกับ Excel ที่ซับซ้อน)</p>}
              </div>

              {/* Drop zone */}
              <div
                onDragOver={e => { e.preventDefault(); setDragging(true); }}
                onDragLeave={() => setDragging(false)}
                onDrop={handleDrop}
                className={`border-2 border-dashed rounded-xl p-10 text-center transition-colors cursor-pointer
                  ${dragging ? 'border-indigo-400 bg-indigo-50 dark:bg-indigo-900/20' : 'border-slate-300 dark:border-slate-600 hover:border-indigo-400'}`}
                onClick={() => document.getElementById('xl-file-input').click()}
              >
                <Icon name="upload" size={36} cls="mx-auto text-slate-400 mb-3" />
                <p className="font-semibold text-slate-700 dark:text-slate-200 mb-1">วาง Excel ที่นี่ หรือ คลิกเพื่อเลือกไฟล์</p>
                <p className="text-sm text-slate-400">รองรับ .xlsx, .xls, .csv</p>
                <input id="xl-file-input" type="file" accept=".xlsx,.xls,.csv" className="hidden"
                  onChange={e => processFile(e.target.files[0])} />
              </div>
              {error && <p className="text-sm text-red-500 bg-red-50 dark:bg-red-900/20 px-3 py-2 rounded-lg">{error}</p>}
            </div>
          )}

          {!loading && step === 'preview' && parsed && (
            <div className="space-y-5">
              <div className="flex items-center gap-2 text-sm text-emerald-600 dark:text-emerald-400 font-medium">
                <span>✓</span> {useAI && apiKey ? 'AI วิเคราะห์สำเร็จ' : 'Auto-parse สำเร็จ'}
                <span className="text-slate-400 font-normal">— {parsed.scenarios.length} scenario · {totalItems} items</span>
              </div>

              <div>
                <label className="block text-sm font-medium text-slate-700 dark:text-slate-200 mb-1">ชื่อ Project</label>
                <input value={projectName} onChange={e => setProjectName(e.target.value)}
                  className="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm focus:ring-2 focus:ring-indigo-400 outline-none" />
              </div>

              <div className="space-y-3">
                {parsed.scenarios.map((s, i) => (
                  <div key={s.id} className="border border-slate-200 dark:border-slate-600 rounded-xl overflow-hidden">
                    <div className="flex items-center gap-3 px-4 py-2.5" style={{ background: ['#eef2ff','#f0f9ff','#f5f3ff'][i] || '#f8fafc' }}>
                      <span className="w-3 h-3 rounded-full flex-shrink-0" style={{ background: ['#6366f1','#0ea5e9','#8b5cf6'][i] || '#94a3b8' }} />
                      <input value={scenLabels[i] || ''} onChange={e => setScenLabels(sl => sl.map((l,j) => j===i ? e.target.value : l))}
                        className="flex-1 bg-transparent text-sm font-semibold text-slate-800 outline-none border-b border-transparent focus:border-indigo-400" />
                      <span className="text-xs text-slate-500">{s.categories.reduce((sum,c) => sum+c.items.length,0)} items</span>
                    </div>
                    <div className="px-4 py-2 max-h-52 overflow-y-auto">
                      {s.categories.map(cat => (
                        <div key={cat.id} className="mb-2">
                          <p className="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-1">{cat.name}</p>
                          {cat.items.slice(0, 6).map(it => (
                            <div key={it.id} className="flex justify-between text-xs py-0.5 text-slate-600 dark:text-slate-300">
                              <span className="truncate mr-4">{it.name}</span>
                              <span className="flex-shrink-0 font-mono">{currency(it.value)}</span>
                            </div>
                          ))}
                          {cat.items.length > 6 && <p className="text-xs text-slate-400 italic">+{cat.items.length-6} more...</p>}
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>

        {/* Footer */}
        {!loading && (
          <div className="px-6 py-4 border-t border-slate-200 dark:border-slate-700 flex justify-between">
            {step === 'preview' ? (
              <>
                <Btn v="ghost" onClick={() => setStep('upload')}>← เลือกไฟล์ใหม่</Btn>
                <Btn v="primary" onClick={handleImport}><Icon name="upload" size={15} />Import เป็น Project ใหม่</Btn>
              </>
            ) : (
              <Btn v="ghost" onClick={onClose}>ยกเลิก</Btn>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ─── APP ROOT ────────────────────────────────────────────────────────────────
function App() {
  const [projects, setProjects]             = React.useState(INIT_PROJECTS);
  const [packages, setPackages]             = React.useState(INIT_PACKAGES);
  const [screen, setScreen]                 = React.useState('dashboard');
  const [activeProjectId, setActiveProjectId] = React.useState(null);
  const [darkMode, setDarkMode]             = React.useState(false);
  const [toast, setToast]                   = React.useState(null);
  const [saveModal, setSaveModal]           = React.useState(null);
  const [showImport, setShowImport]         = React.useState(false);

  React.useEffect(() => {
    document.documentElement.classList.toggle('dark', darkMode);
  }, [darkMode]);

  const showToast = (msg, type='success') => {
    setToast({ msg, type, id: uid() });
    setTimeout(() => setToast(null), 3200);
  };

  // ── Project helpers ──────────────────────────────────────────────────────
  const activeProject = projects.find(p => p.id === activeProjectId) || null;

  const openProject = (id) => {
    setActiveProjectId(id);
    setScreen('compare');
  };

  const createProject = () => {
    const mkScenario = (label) => ({
      id: uid(), label, subtitle: '', units: 0, revenuePerUnit: 0, assumptions: [],
      categories: [
        { id: uid(), name: 'Revenue', icon: '💰',
          items: [{ id: uid(), name: 'Item 1', itemType: 'revenue', qty: 1, unitPrice: 0, value: 0 }] },
        { id: uid(), name: 'Expenses', icon: '📋',
          items: [{ id: uid(), name: 'Item 1', itemType: 'cost', qty: 1, unitPrice: 0, value: 0 }] },
      ],
    });
    const sA = mkScenario('Option A'), sB = mkScenario('Option B');
    const proj = {
      id: uid(), name: 'New Project', status: 'draft',
      currency: 'THB', isFavorite: false,
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
      comparisons: [{ id: uid(), leftId: sA.id, rightId: sB.id }],
      scenarios: [sA, sB],
    };
    setProjects(prev => [proj, ...prev]);
    openProject(proj.id);
  };

  // ── Generic project field update ────────────────────────────────────────
  const updProject = (id, field, value) => {
    setProjects(prev => prev.map(p =>
      p.id !== id ? p : { ...p, [field]: value, updatedAt: new Date().toISOString() }
    ));
  };

  const saveDraft = (id) => {
    setProjects(prev => prev.map(p =>
      p.id !== id ? p : { ...p, status: 'draft', updatedAt: new Date().toISOString() }
    ));
    showToast('Draft saved');
  };

  // ── Scenario-level updates ───────────────────────────────────────────────
  const updScenario = (projectId, scenarioId, field, value) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      return {
        ...p,
        updatedAt: new Date().toISOString(),
        scenarios: p.scenarios.map(s =>
          s.id !== scenarioId ? s : { ...s, [field]: value }
        ),
      };
    }));
  };

  // ── Assumption updates ───────────────────────────────────────────────────
  const updAssumption = (projectId, scenarioId, asmIdx, field, value) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      return {
        ...p,
        scenarios: p.scenarios.map(s => {
          if (s.id !== scenarioId) return s;
          const assumptions = s.assumptions.map((a, i) =>
            i !== asmIdx ? a : { ...a, [field]: value }
          );
          return { ...s, assumptions };
        }),
      };
    }));
  };

  const addAssumption = (projectId, scenarioId) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      return {
        ...p,
        scenarios: p.scenarios.map(s => {
          if (s.id !== scenarioId) return s;
          return { ...s, assumptions: [...(s.assumptions||[]), { id: uid(), key: 'Assumption', value: '' }] };
        }),
      };
    }));
  };

  const remAssumption = (projectId, scenarioId, asmIdx) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      return {
        ...p,
        scenarios: p.scenarios.map(s => {
          if (s.id !== scenarioId) return s;
          return { ...s, assumptions: s.assumptions.filter((_,i) => i !== asmIdx) };
        }),
      };
    }));
  };

  // ── Category updates ─────────────────────────────────────────────────────
  const addCat = (projectId, scenarioId) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      return {
        ...p,
        scenarios: p.scenarios.map(s => {
          if (s.id !== scenarioId) return s;
          const newCat = { id: uid(), name: 'New Segment', icon: '📦',
            items: [{ id: uid(), name: 'Item 1', itemType: 'revenue', qty: 1, unitPrice: 0, value: 0 }] };
          return { ...s, categories: [...s.categories, newCat] };
        }),
      };
    }));
  };

  const addComparison = (projectId) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      const mkScen = (label) => ({
        id: uid(), label, subtitle: '', units: 1, revenuePerUnit: 0, assumptions: [],
        categories: [
          { id: uid(), name: 'Revenue', icon: '💰',
            items: [{ id: uid(), name: 'Item 1', itemType: 'revenue', qty: 1, unitPrice: 0, value: 0 }] },
          { id: uid(), name: 'Expenses', icon: '📋',
            items: [{ id: uid(), name: 'Item 1', itemType: 'cost', qty: 1, unitPrice: 0, value: 0 }] },
        ],
      });
      const sL = mkScen('Option A'), sR = mkScen('Option B');
      const newCmp = { id: uid(), leftId: sL.id, rightId: sR.id };
      return { ...p, scenarios: [...p.scenarios, sL, sR], comparisons: [...(p.comparisons||[]), newCmp] };
    }));
  };

  const removeComparison = (projectId, cmpId) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      const cmp = (p.comparisons||[]).find(c => c.id === cmpId);
      const removedIds = cmp ? [cmp.leftId, cmp.rightId] : [];
      return {
        ...p,
        comparisons: (p.comparisons||[]).filter(c => c.id !== cmpId),
        scenarios: p.scenarios.filter(s => !removedIds.includes(s.id)),
      };
    }));
  };

  const remCat = (projectId, scenarioId, catId) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      return {
        ...p,
        scenarios: p.scenarios.map(s => {
          if (s.id !== scenarioId) return s;
          return { ...s, categories: s.categories.filter(c => c.id !== catId) };
        }),
      };
    }));
  };

  const updCat = (projectId, scenarioId, catId, field, value) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      return {
        ...p,
        scenarios: p.scenarios.map(s => {
          if (s.id !== scenarioId) return s;
          return { ...s, categories: s.categories.map(c => c.id !== catId ? c : { ...c, [field]: value }) };
        }),
      };
    }));
  };

  // ── Line-item updates ────────────────────────────────────────────────────
  const addItem = (projectId, scenarioId, catId, type='revenue') => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      return {
        ...p,
        scenarios: p.scenarios.map(s => {
          if (s.id !== scenarioId) return s;
          return {
            ...s,
            categories: s.categories.map(c => {
              if (c.id !== catId) return c;
              const newItem = type === 'pct'
                ? { id: uid(), name: 'New %', itemType: 'pct', pctRate: 10, pctBase: 'cat_revenue', pctTarget: 'cost' }
                : { id: uid(), name: 'New Item', itemType: type, qty: 1, unitPrice: 0, value: 0 };
              return { ...c, items: [...c.items, newItem] };
            }),
          };
        }),
      };
    }));
  };

  const remItem = (projectId, scenarioId, catId, itemId) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      return {
        ...p,
        scenarios: p.scenarios.map(s => {
          if (s.id !== scenarioId) return s;
          return {
            ...s,
            categories: s.categories.map(c => {
              if (c.id !== catId) return c;
              return { ...c, items: c.items.filter(it => it.id !== itemId) };
            }),
          };
        }),
      };
    }));
  };

  const updItem = (projectId, scenarioId, catId, itemId, field, value) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      return {
        ...p,
        scenarios: p.scenarios.map(s => {
          if (s.id !== scenarioId) return s;
          return {
            ...s,
            categories: s.categories.map(c => {
              if (c.id !== catId) return c;
              return { ...c, items: c.items.map(it => it.id !== itemId ? it : { ...it, [field]: value }) };
            }),
          };
        }),
      };
    }));
  };

  // ── Package handlers ──────────────────────────────────────────────────────
  const handleSavePackage = (scenario) => setSaveModal(scenario);

  const handleSavePackageSubmit = (form) => {
    const scenario = saveModal;
    const m = calcMetrics(scenario);
    const pkg = {
      id: uid(),
      name: form.name,
      category: form.category,
      saveType: form.saveType,
      description: form.description,
      tags: form.tags.split(',').map(t=>t.trim()).filter(Boolean),
      isFavorite: false,
      usageCount: 0,
      metrics: { rev: m.rev, cost: m.tot, profit: m.net, margin: m.netMgn },
      savedAt: new Date().toISOString(),
      createdAt: new Date().toISOString(),
      scenario: form.incItems ? scenario : null,
      assumptions: form.incAssumptions ? (scenario.assumptions || []) : [],
    };
    setPackages(prev => [pkg, ...prev]);
    setSaveModal(null);
    showToast(`"${form.name}" saved to Package Library`);
  };

  const toggleFavPackage = (pkgId) => {
    setPackages(prev => prev.map(p => p.id !== pkgId ? p : { ...p, isFavorite: !p.isFavorite }));
  };

  const usePackage = (pkg) => {
    setPackages(prev => prev.map(p => p.id !== pkg.id ? p : { ...p, usageCount: (p.usageCount||0) + 1 }));
    if (pkg.scenario) {
      const scenarioA = { ...pkg.scenario, id: uid(), label: pkg.name, name: pkg.name };
      const scenarioB = { id: uid(), label: 'Scenario B', name: 'Scenario B', subtitle: '', units: 1, revenuePerUnit: 0, assumptions: [], categories: [] };
      const comparison = { id: uid(), leftId: scenarioA.id, rightId: scenarioB.id };
      const proj = {
        id: uid(), name: pkg.name, subtitle: pkg.description || '', currency: 'THB',
        isFavorite: false, status: 'draft', createdAt: new Date().toISOString(),
        scenarios: [scenarioA, scenarioB],
        comparisons: [comparison],
      };
      setProjects(prev => [proj, ...prev]);
      openProject(proj.id);
      showToast(`เปิด Package "${pkg.name}" เป็น Project ใหม่แล้ว`);
    } else {
      showToast(`Package "${pkg.name}" ไม่มีข้อมูล Scenario`);
    }
  };

  const clonePackage = (pkg) => {
    const cloned = { ...pkg, id: uid(), name: pkg.name + ' (Copy)', favorite: false, createdAt: new Date().toISOString() };
    setPackages(prev => [cloned, ...prev]);
    showToast(`Cloned "${pkg.name}"`);
  };

  // ── Handlers bundle ───────────────────────────────────────────────────────
  const handlers = {
    updProject:     (f, v)             => activeProject && updProject(activeProject.id, f, v),
    saveDraft:      ()                 => activeProject && saveDraft(activeProject.id),
    updScenario:    (sid, f, v)        => activeProject && updScenario(activeProject.id, sid, f, v),
    updAssumption:  (sid, i, f, v)     => activeProject && updAssumption(activeProject.id, sid, i, f, v),
    addAssumption:  (sid)              => activeProject && addAssumption(activeProject.id, sid),
    remAssumption:  (sid, i)           => activeProject && remAssumption(activeProject.id, sid, i),
    addCat:         (sid)              => activeProject && addCat(activeProject.id, sid),
    remCat:         (sid, cid)         => activeProject && remCat(activeProject.id, sid, cid),
    updCat:         (sid, cid, f, v)   => activeProject && updCat(activeProject.id, sid, cid, f, v),
    addItem:        (sid, cid, type)   => activeProject && addItem(activeProject.id, sid, cid, type),
    remItem:        (sid, cid, iid)    => activeProject && remItem(activeProject.id, sid, cid, iid),
    updItem:        (sid, cid, iid, f, v) => activeProject && updItem(activeProject.id, sid, cid, iid, f, v),
    addComparison:  (pid)              => addComparison(pid),
    removeComparison: (pid, cmpId)     => removeComparison(pid, cmpId),
  };

  // ── Render ────────────────────────────────────────────────────────────────
  return (
    <div className="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-300">
      {/* Global nav */}
      <header className="sticky top-0 z-40 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-sm">
        <div className="max-w-7xl mx-auto px-4 h-14 flex items-center gap-3">
          <button onClick={()=>setScreen('dashboard')} className="flex items-center gap-2 font-bold text-lg text-indigo-600 dark:text-indigo-400">
            <Icon name="zap" size={20} cls="text-indigo-500" />
            <span className="hidden sm:inline">Offer Builder</span>
          </button>
          <div className="flex-1" />
          {/* Nav tabs */}
          {['dashboard','compare','packages'].map(s => (
            <button key={s}
              onClick={() => { if(s==='compare' && !activeProjectId && projects.length>0) setActiveProjectId(projects[0].id); setScreen(s); }}
              className={`px-3 py-1.5 rounded-lg text-sm font-medium transition-colors ${screen===s
                ? 'bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400'
                : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}>
              {s==='dashboard'?'Dashboard':s==='compare'?'Compare':'Library'}
            </button>
          ))}
          <button onClick={()=>setDarkMode(d=>!d)}
            className="ml-1 p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
            title="Toggle dark mode">
            <Icon name={darkMode?'sun':'moon'} size={18} />
          </button>
        </div>
      </header>

      {/* Screen router */}
      <main className="max-w-7xl mx-auto px-4 py-6">
        {screen === 'dashboard' && (
          <Dashboard
            projects={projects}
            packages={packages}
            onOpenProject={openProject}
            onNewProject={createProject}
            onImportExcel={() => setShowImport(true)}
            onToggleFav={toggleFavPackage}
          />
        )}
        {screen === 'compare' && activeProject && (
          <ScenarioCompare
            project={activeProject}
            handlers={handlers}
            onSavePackage={handleSavePackage}
            onBack={() => setScreen('dashboard')}
            darkMode={darkMode}
            setDarkMode={setDarkMode}
          />
        )}
        {screen === 'compare' && !activeProject && (
          <div className="text-center py-24">
            <Icon name="folder" size={48} cls="mx-auto text-slate-300 dark:text-slate-600 mb-4" />
            <p className="text-xl font-semibold text-slate-500 mb-2">No project selected</p>
            <p className="text-slate-400 mb-6">Open a project from the dashboard or create a new one.</p>
            <Btn variant="primary" onClick={()=>setScreen('dashboard')}>Go to Dashboard</Btn>
          </div>
        )}
        {screen === 'packages' && (
          <PackageLibrary
            packages={packages}
            onToggleFav={toggleFavPackage}
            onUse={usePackage}
            onClone={clonePackage}
            onBack={() => setScreen('dashboard')}
            darkMode={darkMode}
            setDarkMode={setDarkMode}
          />
        )}
      </main>

      {/* Save Package Modal */}
      {saveModal && (
        <SavePackageModal
          scenario={saveModal}
          onClose={()=>setSaveModal(null)}
          onSave={handleSavePackageSubmit}
        />
      )}

      {/* Excel Import Modal */}
      {showImport && (
        <ExcelImportModal
          onClose={() => setShowImport(false)}
          onImport={(rawProj) => {
            // Normalise to current schema
            const scenarios = (rawProj.scenarios || []).map(s => ({
              ...s,
              categories: (s.categories || []).map(c => ({
                ...c,
                isRevenue: c.isRevenue === true,
                isDirectCost: c.isDirectCost !== false || c.isDirect !== false,
              })),
            }));
            let { comparisons } = rawProj;
            if (!comparisons || comparisons.length === 0) {
              comparisons = [];
              for (let i = 0; i < scenarios.length - 1; i++) {
                comparisons.push({ id: uid(), leftId: scenarios[i].id, rightId: scenarios[i + 1].id });
              }
              if (comparisons.length === 0 && scenarios.length > 0) {
                const blank = { id: uid(), label: 'Scenario B', name: 'Scenario B', subtitle: '', units: 1, revenuePerUnit: 0, assumptions: [], categories: [] };
                scenarios.push(blank);
                comparisons.push({ id: uid(), leftId: scenarios[0].id, rightId: blank.id });
              }
            }
            const proj = { currency: 'THB', isFavorite: false, createdAt: new Date().toISOString(), ...rawProj, scenarios, comparisons };
            setProjects(prev => [proj, ...prev]);
            openProject(proj.id);
            showToast(`นำเข้า "${proj.name}" สำเร็จ — ${scenarios.length} scenarios`);
          }}
        />
      )}

      {/* Toast */}
      {toast && <Toast key={toast.id} msg={toast.msg} type={toast.type} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
