let _uidCounter = 1000;
function uid() { return 'id' + (++_uidCounter) + Math.random().toString(36).slice(2,6); }

const CURRENCIES = {
  THB: { symbol:'฿',  code:'THB', name:'Thai Baht',          decimals:0 },
  USD: { symbol:'$',  code:'USD', name:'US Dollar',           decimals:2 },
  EUR: { symbol:'€',  code:'EUR', name:'Euro',                decimals:2 },
  GBP: { symbol:'£',  code:'GBP', name:'British Pound',       decimals:2 },
  SGD: { symbol:'S$', code:'SGD', name:'Singapore Dollar',    decimals:2 },
  JPY: { symbol:'¥',  code:'JPY', name:'Japanese Yen',        decimals:0 },
};

function fmtCurrency(n, code='THB', compact=true) {
  if (n === null || n === undefined || isNaN(n)) n = 0;
  const { symbol, decimals } = CURRENCIES[code] || CURRENCIES.THB;
  const abs = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  if (compact) {
    if (abs >= 1000000) return sign + symbol + (abs/1000000).toFixed(2).replace(/\.?0+$/,'') + 'M';
    if (abs >= 1000)    return sign + symbol + (abs/1000).toFixed(1).replace(/\.0$/,'') + 'K';
  }
  return sign + symbol + abs.toLocaleString(undefined, { minimumFractionDigits:0, maximumFractionDigits:decimals });
}

function currency(n) { return fmtCurrency(n, 'THB'); }

function pct(n) {
  if (n === null || n === undefined || isNaN(n)) return '0.0%';
  return n.toFixed(1) + '%';
}

function calcCategoryMetrics(cat) {
  const items = cat.items || [];
  const defaultType = cat.isRevenue !== false ? 'revenue' : 'cost';
  let revenue = 0, cost = 0;
  items.filter(it => it.itemType !== 'pct').forEach(it => {
    const type = it.itemType || defaultType;
    const qty = Number(it.qty) || 0;
    const price = Number(it.unitPrice) || Number(it.value) || 0;
    const amt = qty > 0 ? qty * price : price;
    if (type === 'cost') {
      cost += amt;
    } else {
      revenue += amt;
      const cogsPerUnit = Number(it.unitCost) || 0;
      if (cogsPerUnit > 0) cost += qty > 0 ? qty * cogsPerUnit : cogsPerUnit;
    }
  });
  items.filter(it => it.itemType === 'pct').forEach(it => {
    const rate = (Number(it.pctRate) || 0) / 100;
    const base = it.pctBase === 'cat_cost' ? cost : revenue;
    const amt = base * rate;
    if (it.pctTarget === 'revenue') {
      revenue += amt;
    } else {
      cost += amt;
    }
  });
  return { revenue, cost, net: revenue - cost };
}

function calcMetrics(scenario) {
  let revenue = 0, expenses = 0;
  (scenario.categories || []).forEach(cat => {
    const m = calcCategoryMetrics(cat);
    revenue += m.revenue;
    expenses += m.cost;
  });
  if (revenue === 0) {
    const u = Number(scenario.units)||0, rpu = Number(scenario.revenuePerUnit)||0;
    if (u > 0 || rpu > 0) revenue = u * rpu;
  }
  const net = revenue - expenses;
  const margin = revenue > 0 ? (net / revenue) * 100 : 0;
  const units = Number(scenario.units) || 1;
  return { revenue, cogs:0, grossProfit:net, expenses, net, margin,
    rev:revenue, tot:expenses, gross:net, direct:expenses,
    netMgn:margin, grossMgn:margin,
    cpu: expenses/units, ppu: net/units };
}

const CurrencyCtx = React.createContext({ code: 'THB', compact: true });
function useCur() {
  const { code, compact } = React.useContext(CurrencyCtx);
  return (n) => fmtCurrency(n, code, compact);

function Icon({ name, size=16, cls='' }) {
  const d = ICONS[name];
  if (!d) return null;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
      className={cls}>
      <path d={d} />
    </svg>
  );
}

// ── Base UI Components ─────────────────────────────────────────────────────
function Btn({ v='primary', sz='md', cls='', disabled=false, onClick, children, title }) {
  const base = 'inline-flex items-center gap-1.5 font-medium rounded-lg transition-all duration-150 focus:ring-2 focus:ring-offset-1 select-none';
  const sizes = { sm:'px-2.5 py-1.5 text-xs', md:'px-4 py-2 text-sm', lg:'px-5 py-2.5 text-base', icon:'p-1.5' };
  const vars = {
    primary: 'bg-indigo-600 hover:bg-indigo-700 text-white focus:ring-indigo-500 shadow-sm',
    secondary:'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 focus:ring-slate-300 shadow-sm',
    ghost:   'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 focus:ring-slate-300',
    danger:  'bg-red-600 hover:bg-red-700 text-white focus:ring-red-500 shadow-sm',
    success: 'bg-emerald-600 hover:bg-emerald-700 text-white focus:ring-emerald-500 shadow-sm',
  };
  const dis = disabled ? 'opacity-50 cursor-not-allowed pointer-events-none' : 'cursor-pointer';
  return (
    <button title={title} disabled={disabled} onClick={onClick}
      className={`${base} ${sizes[sz]} ${vars[v]} ${dis} ${cls}`}>
      {children}
    </button>
  );
}

function Badge({ color='gray', cls='', children }) {
  const colors = {
    gray:   'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300',
    indigo: 'bg-indigo-100 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300',
    sky:    'bg-sky-100 dark:bg-sky-900/40 text-sky-700 dark:text-sky-300',
    violet: 'bg-violet-100 dark:bg-violet-900/40 text-violet-700 dark:text-violet-300',
    green:  'bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300',
    amber:  'bg-amber-100 dark:bg-amber-900/40 text-amber-700 dark:text-amber-300',
    red:    'bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-300',
    blue:   'bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300',
  };
  return <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium ${colors[color]} ${cls}`}>{children}</span>;
}

function Card({ cls='', onClick, children }) {
  const interClass = onClick ? 'cursor-pointer hover:shadow-md hover:-translate-y-0.5 transition-all duration-150' : '';
  return (
    <div onClick={onClick}
      className={`bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm ${interClass} ${cls}`}>
      {children}
    </div>
  );
}

function Toast({ toast, onDismiss }) {
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(onDismiss, 3000);
    return () => clearTimeout(t);
  }, [toast]);
  if (!toast) return null;
  const icons = { success:'check', error:'alert', info:'info' };
  const styles = {
    success:'bg-emerald-600 text-white',
    error:'bg-red-600 text-white',
    info:'bg-slate-800 dark:bg-slate-700 text-white',
  };
  return (
    <div className={`fixed top-5 right-5 z-50 flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-xl fade-up ${styles[toast.type||'info']}`}>
      <Icon name={icons[toast.type||'info']} size={16} />
      <span className="text-sm font-medium">{toast.msg}</span>
      <button onClick={onDismiss} className="ml-1 opacity-75 hover:opacity-100"><Icon name="x" size={14} /></button>
    </div>
  );
}

// ── Star Icon (filled variant) ─────────────────────────────────────────────
function StarIcon({ filled=false, size=16, cls='' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24"
      fill={filled ? '#f59e0b' : 'none'} stroke={filled ? '#f59e0b' : 'currentColor'}
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={cls}>
      <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
    </svg>
  );
}

// ── Dashboard ──────────────────────────────────────────────────────────────
function KPICard({ icon, iconBg, label, value, sub }) {
  return (
    <Card cls="p-5">
      <div className="flex items-start justify-between">
        <div className="min-w-0 flex-1">
          <p className="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wide">{label}</p>
          <p className="text-2xl font-bold mt-1 text-slate-800 dark:text-slate-100">{value}</p>
          {sub && <p className="text-xs text-slate-400 mt-0.5 truncate">{sub}</p>}
        </div>
        <div className={`p-2.5 rounded-xl ${iconBg} flex-shrink-0 ml-3`}>
          <Icon name={icon} size={18} cls="text-white" />
        </div>
      </div>
    </Card>
  );
}

function ProjectCard({ project, onOpen }) {
  const scenarios = project.scenarios || [];
  const allMetrics = scenarios.map(s => calcMetrics(s));
  const bestMargin = allMetrics.length ? Math.max(...allMetrics.map(m => m.netMgn)) : 0;
  const totalRev = allMetrics.reduce((a, m) => a + m.rev, 0);
  return (
    <Card cls="p-5" onClick={onOpen}>
      <div className="flex items-start justify-between mb-3">
        <div className="flex-1 min-w-0 mr-3">
          <h3 className="font-semibold text-sm leading-snug line-clamp-2 text-slate-800 dark:text-slate-100">{project.name}</h3>
          <p className="text-xs text-slate-400 mt-1 line-clamp-1">{project.description}</p>
        </div>
        <Badge color={project.status === 'active' ? 'green' : 'amber'}>{project.status}</Badge>
      </div>
      <div className="flex gap-2 mb-3">
        {scenarios.map((s, i) => (
          <div key={s.id} className="flex items-center gap-1.5 flex-1 min-w-0">
            <span className="w-2 h-2 rounded-full flex-shrink-0" style={{background: SCOL[i]?.dot || '#94a3b8'}} />
            <span className="text-xs text-slate-500 dark:text-slate-400 truncate">{s.subtitle || s.name}</span>
          </div>
        ))}
      </div>
      <div className="flex items-center justify-between pt-3 border-t border-slate-100 dark:border-slate-700">
        <span className="text-xs text-slate-400 flex items-center gap-1">
          <Icon name="clock" size={11} />{project.updatedAt}
        </span>
        <span className="text-xs font-semibold text-indigo-600 dark:text-indigo-400">
          Rev {currency(totalRev)} · Best {pct(bestMargin)}
        </span>
      </div>
    </Card>
  );
}

  return (
    <div className="min-h-screen">
      <nav className="sticky top-0 z-30 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700">

          <div className="flex items-center gap-2">
            <Btn v="ghost" sz="sm" onClick={onOpenLibrary}><Icon name="pkg" size={14} /><span className="hidden sm:inline">Library</span></Btn>
            <Btn v="ghost" sz="icon" onClick={() => setDarkMode(!darkMode)} title="Toggle dark mode">
              <Icon name={darkMode ? 'sun' : 'moon'} size={16} />
            </Btn>
          </div>
        </div>
      </nav>
      <div className="max-w-6xl mx-auto px-4 sm:px-6 py-8">
        <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-8">
          <div>
            <h1 className="text-2xl font-bold text-slate-900 dark:text-white">Dashboard</h1>
            <p className="text-slate-500 dark:text-slate-400 text-sm mt-1">Compare scenarios, evaluate feasibility, build packages.</p>
          </div>
          <div className="flex gap-2 self-start sm:self-auto">
            <Btn v="secondary" onClick={onImportExcel}>
              <Icon name="upload" size={16} />Import Excel
            </Btn>
            <Btn v="primary" onClick={onNewProject}>
              <Icon name="plus" size={16} />New Comparison
            </Btn>
          </div>
        </div>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
          <KPICard icon="layers" iconBg="bg-indigo-500" label="Projects" value={projects.length} sub={`${projects.filter(p=>p.status==='active').length} active`} />
          <KPICard icon="pkg" iconBg="bg-violet-500" label="Packages" value={packages.length} sub={`${favPackages.length} favorited`} />
          <KPICard icon="trendUp" iconBg="bg-emerald-500" label="Best Margin" value={bestMarginPkg ? pct(bestMarginPkg.metrics.margin) : '—'} sub={bestMarginPkg?.name} />
          <KPICard icon="dollar" iconBg="bg-amber-500" label="Revenue Modeled" value={currency(totalRevModeled)} sub="across all scenarios" />
        </div>
        <div className="mb-8">
          <div className="flex items-center justify-between mb-4">
            <h2 className="font-semibold text-slate-800 dark:text-slate-100">Recent Comparisons</h2>
            <Btn v="ghost" sz="sm" onClick={onNewProject}><Icon name="plus" size={13} />New</Btn>
          </div>
          {projects.length === 0 ? (
            <Card cls="p-12 text-center">
              <Icon name="bar" size={40} cls="mx-auto text-slate-300 dark:text-slate-600 mb-3" />
              <p className="font-medium text-slate-500 mb-1">No comparisons yet</p>
              <p className="text-sm text-slate-400">Create your first scenario comparison to get started.</p>
              <Btn v="primary" cls="mt-4" onClick={onNewProject}><Icon name="plus" size={14} />New Comparison</Btn>

              {projects.map(p => <ProjectCard key={p.id} project={p} onOpen={() => onOpenProject(p.id)} />)}

          )}
        </div>
        <div>
          <div className="flex items-center justify-between mb-4">
            <h2 className="font-semibold text-slate-800 dark:text-slate-100">Favorite Packages</h2>
            <Btn v="ghost" sz="sm" onClick={onOpenLibrary}><span>View all</span><Icon name="arrowRight" size={13} /></Btn>

            <Card cls="p-8 text-center">
              <Icon name="star" size={32} cls="mx-auto text-slate-300 dark:text-slate-600 mb-2" />
              <p className="text-sm text-slate-400">No favorite packages yet. Star packages from the library.</p>
            </Card>
          ) : (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              {favPackages.map(pkg => (
                <Card key={pkg.id} cls="p-4">
                  <div className="flex items-start justify-between mb-2">

                      <p className="text-xs text-slate-400">{pkg.category}</p>

                    <span className="text-slate-400">Mgn <span className={`font-semibold ${pkg.metrics.margin>=0?'text-emerald-600':'text-red-500'}`}>{pct(pkg.metrics.margin)}</span></span>

function SavePackageModal({ scenario, onSave, onClose }) {

    name: scenario.subtitle || scenario.name, category:'Events',
    tags:'', description:'', saveType:'package',
    incAssumptions:true, incItems:true, incRevenue:true, incNotes:true,

  const set = (k,v) => setForm(f => ({...f,[k]:v}));
  const CATS = ['Events','SaaS','Marketing','Food & Beverage','Professional Services','Retail','Construction','Other'];
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm"
      onClick={e => e.target===e.currentTarget && onClose()}>

              </div>
              <div className="space-y-1">
                {(s.assumptions||[]).map(a=>(
                  <div key={a.id} className="flex items-center gap-1 group text-xs">
                    <input value={a.label} onChange={e=>onUpdate(s.id,a.id,'label',e.target.value)}
                      className="cell-input text-slate-500 w-20 flex-shrink-0" placeholder="Key…" />
                    <span className="text-slate-300">:</span>
                    <input value={a.value} onChange={e=>onUpdate(s.id,a.id,'value',e.target.value)}
                      className="cell-input flex-1 font-medium" placeholder="Value…" />
                    <button onClick={()=>onRemove(s.id,a.id)} className="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-500">
                      <Icon name="x" size={11} />
                    </button>
                  </div>
                ))}
                <button onClick={()=>onAdd(s.id)} className="flex items-center gap-1 text-xs text-slate-400 hover:text-indigo-600 py-0.5 transition-colors">
                  <Icon name="plus" size={11} />Add row
                </button>
              </div>
            </div>
          ))}
        </div>
      )}
    </Card>
  );
}

// ── Line Item Row ──────────────────────────────────────────────────────────
function LineItemRow({ item, onUpdate, onRemove, catRevenue, catCost, defaultType }) {
  const cur = useCur();
  const type = item.itemType || defaultType || 'revenue';
  const qty = Number(item.qty) || 0;
  const price = Number(item.unitPrice) || Number(item.value) || 0;
  const total = qty > 0 ? qty * price : price;
  const [showCost, setShowCost] = useState(item.unitCost !== undefined);

  const TYPE_CYCLE = ['revenue','cost','pct'];
  const cycleType = () => {
    const next = TYPE_CYCLE[(TYPE_CYCLE.indexOf(type) + 1) % TYPE_CYCLE.length];
    onUpdate('itemType', next);
    if (next === 'pct') { onUpdate('pctRate', item.pctRate || 10); onUpdate('pctBase', item.pctBase || 'cat_revenue'); }
  };

  const TypeBadge = () => {
    const cfg = {
      revenue: 'bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300',
      cost:    'bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400',
      pct:     'bg-amber-50 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400',
    };
    const lbl = {
      revenue: 'Rev',
      cost: 'Cost',
      pct: (item.pctTarget === 'revenue') ? '%↑' : '%↓',
    };
    const pctCfg = (item.pctTarget === 'revenue')
      ? 'bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400'
      : 'bg-amber-50 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400';
    return (
      <button onClick={cycleType} title="Cycle type: Revenue → Cost → %"
        className={`text-[10px] px-1.5 py-0.5 rounded font-semibold flex-shrink-0 transition-colors ${type === 'pct' ? pctCfg : cfg[type]||cfg.revenue}`}>
        {lbl[type]||'Rev'}
      </button>
    );
  };

  if (type === 'pct') {
    const pctTarget = item.pctTarget || 'cost';
    const rate = (Number(item.pctRate) || 0) / 100;
    const base = item.pctBase === 'cat_cost' ? catCost : catRevenue;
    const computed = base * rate;
    const isRevTarget = pctTarget === 'revenue';
    const resultColor = isRevTarget
      ? 'text-emerald-600 dark:text-emerald-400'
      : 'text-red-500 dark:text-red-400';
    const borderColor = isRevTarget
      ? 'border-emerald-300 dark:border-emerald-700'
      : 'border-amber-300 dark:border-amber-700';
    return (
      <div className={`flex items-center gap-1 py-0.5 group/item text-xs border-l-2 ${borderColor} pl-2 mb-1`}>
        <input type="text" value={item.name} onChange={e=>onUpdate('name',e.target.value)}
          className="cell-input flex-1 min-w-0 text-slate-700 dark:text-slate-200" placeholder="Item name…" />
        <input type="number" value={item.pctRate??10} onChange={e=>onUpdate('pctRate',Number(e.target.value)||0)}
          className="cell-input w-10 text-right font-mono text-slate-600 dark:text-slate-300" />
        <span className="text-slate-300 text-[10px] flex-shrink-0">% of</span>
        <select value={item.pctBase||'cat_revenue'} onChange={e=>onUpdate('pctBase',e.target.value)}
          className="text-[10px] bg-transparent text-slate-500 border border-slate-200 dark:border-slate-600 rounded px-1 py-0.5 flex-shrink-0">
          <option value="cat_revenue">Seg Rev</option>
          <option value="cat_cost">Seg Cost</option>
        </select>
        <span className="text-slate-300 text-[10px] flex-shrink-0">→</span>
        <select value={pctTarget} onChange={e=>onUpdate('pctTarget',e.target.value)}
          className={`text-[10px] font-semibold bg-transparent border border-slate-200 dark:border-slate-600 rounded px-1 py-0.5 flex-shrink-0 ${resultColor}`}>
          <option value="revenue">Revenue</option>
          <option value="cost">Cost</option>
        </select>
        <span className="text-slate-300 flex-shrink-0">=</span>
        <span className={`w-20 text-right font-mono font-semibold flex-shrink-0 ${resultColor}`}>
          {isRevTarget ? '+' : '-'}{cur(computed)}
        </span>
        <TypeBadge/>
        <button onClick={onRemove} className="opacity-0 group-hover/item:opacity-100 p-0.5 text-slate-300 hover:text-red-500 transition-all flex-shrink-0">
          <Icon name="x" size={12}/>
        </button>
      </div>
    );
  }

  const isRev = type === 'revenue';
  const borderCls = isRev
    ? 'border-emerald-300 dark:border-emerald-700'
    : 'border-red-300 dark:border-red-800';
  const unitCost = Number(item.unitCost) || 0;
  const netContrib = total - qty * unitCost;

  return (
    <div className={`flex flex-col py-0.5 group/item text-xs border-l-2 ${borderCls} pl-2 mb-1`}>
      <div className="flex items-center gap-1">
        <input type="text" value={item.name} onChange={e=>onUpdate('name',e.target.value)}
          className="cell-input flex-1 min-w-0 text-slate-700 dark:text-slate-200" placeholder="Item name…" />
        {item.qty !== undefined ? (
          <>
            <input type="number" value={item.qty??1} onChange={e=>{const q=Number(e.target.value)||0;onUpdate('qty',q);onUpdate('value',q*(Number(item.unitPrice)||0));}}
              className="cell-input w-12 text-right font-mono text-slate-500" placeholder="qty"/>
            <span className="text-slate-300 flex-shrink-0">×</span>
            <input type="number" value={item.unitPrice??''} onChange={e=>{const p=Number(e.target.value)||0;onUpdate('unitPrice',p);onUpdate('value',(Number(item.qty)||1)*p);}}
              className="cell-input w-20 text-right font-mono text-slate-600 dark:text-slate-300" placeholder="price"/>
            <span className="text-slate-300 flex-shrink-0">=</span>
            <span className={`w-20 text-right font-mono font-semibold flex-shrink-0 ${isRev&&showCost?'text-slate-400 dark:text-slate-500 line-through':isRev?'text-emerald-700 dark:text-emerald-300':'text-red-500 dark:text-red-400'}`}>
              {isRev ? cur(total) : `(${cur(total)})`}
            </span>
          </>
        ) : (
          <input type="number" value={item.value||''} onChange={e=>onUpdate('value',Number(e.target.value)||0)}
            className="cell-input w-24 text-right font-mono" placeholder="0"/>
        )}
        {isRev && item.qty !== undefined && (
          <button onClick={()=>{const n=!showCost;setShowCost(n);if(!n)onUpdate('unitCost',undefined);}}
            title={showCost?'Remove unit cost':'Add unit cost'}
            className="opacity-0 group-hover/item:opacity-100 p-0.5 text-slate-300 hover:text-amber-500 transition-all flex-shrink-0 text-[10px] font-bold">
            {showCost?'−$':'+$'}
          </button>
        )}
        <button onClick={()=>{if(item.qty!==undefined){onUpdate('qty',undefined);onUpdate('unitPrice',undefined);}else{onUpdate('qty',1);onUpdate('unitPrice',item.value||0);}}}
          title={item.qty!==undefined?'Flat value':'Qty × price'}
          className="opacity-0 group-hover/item:opacity-100 p-0.5 text-slate-300 hover:text-indigo-500 transition-all flex-shrink-0 text-xs">
          {item.qty!==undefined?'—':'×'}
        </button>
        <TypeBadge/>
        <button onClick={onRemove} className="opacity-0 group-hover/item:opacity-100 p-0.5 text-slate-300 hover:text-red-500 transition-all flex-shrink-0">
          <Icon name="x" size={12}/>
        </button>
      </div>
      {isRev && item.qty !== undefined && showCost && (
        <div className="flex items-center gap-1 mt-0.5">
          <div className="flex-1"/>
          <span className="text-slate-300 text-[10px] flex-shrink-0">− cost/unit</span>
          <input type="number" value={item.unitCost??''} onChange={e=>onUpdate('unitCost',Number(e.target.value)||0)}
            className="cell-input w-20 text-right font-mono text-amber-600 dark:text-amber-400" placeholder="unit cost"/>
          <span className="text-slate-300 flex-shrink-0">=</span>
          <span className={`w-20 text-right font-mono font-bold flex-shrink-0 ${netContrib>=0?'text-emerald-600 dark:text-emerald-400':'text-red-500'}`}>{cur(netContrib)}</span>
          <div className="w-[38px] flex-shrink-0"/>
        </div>
      )}
    </div>
  );
}

// ── Category Group ─────────────────────────────────────────────────────────

  const [open, setOpen] = useState(true);
  const [showIcons, setShowIcons] = useState(false);
  const cur = useCur();
  const cm = calcCategoryMetrics(cat);

  return (
    <div className="mb-3 rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden">
      {/* Category header */}

        <button onClick={()=>setOpen(o=>!o)} className="text-slate-400 hover:text-slate-600 flex-shrink-0">
          <Icon name={open?'chevDown':'chevRight'} size={13}/>

        {/* Icon picker */}
        <div className="relative flex-shrink-0">
          <button onClick={()=>setShowIcons(v=>!v)} title="Set icon"
            className="text-sm leading-none hover:scale-110 transition-transform">{cat.icon||'❓'}</button>
          {showIcons && (
            <div className="absolute top-full left-0 z-30 mt-1 p-2 bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-200 dark:border-slate-600 grid grid-cols-6 gap-0.5 w-44">
              {CAT_ICONS.map(ic=>(
                <button key={ic} onClick={()=>{onUpdateCat('icon',ic);setShowIcons(false);}}
                  className={`text-base p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 ${cat.icon===ic?'bg-indigo-100 dark:bg-indigo-900/40':''}`}>{ic}</button>
              ))}
              <button onClick={()=>{onUpdateCat('icon','');setShowIcons(false);}}
                className="col-span-6 text-[10px] text-slate-400 hover:text-red-500 py-1 mt-0.5 border-t border-slate-100 dark:border-slate-700">Clear</button>
            </div>

        {/* Mini P&L in header */}
        <div className="hidden sm:flex items-center gap-2 text-[10px] font-mono flex-shrink-0">
          <span className="text-emerald-600 dark:text-emerald-400" title="Revenue">{cur(cm.revenue)}</span>
          <span className="text-slate-300">·</span>
          <span className="text-red-500" title="Cost">({cur(cm.cost)})</span>
          <span className="text-slate-300">·</span>
          <span className={`font-bold ${cm.net>=0?'text-slate-700 dark:text-slate-100':'text-red-500'}`} title="Net">{cur(cm.net)}</span>
        </div>

      {open && (
        <div className="px-3 pt-2 pb-3">
          {(cat.items||[]).map(item=>(
            <LineItemRow key={item.id} item={item}
              defaultType={defaultType}
              catRevenue={cm.revenue}
              catCost={cm.cost}
              onUpdate={(f,v)=>onUpdateItem(item.id,f,v)}
              onRemove={()=>onRemoveItem(item.id)}/>
          ))}
          {/* Add buttons */}
          <div className="flex gap-3 mt-1.5">
            <button onClick={()=>onAddItem('revenue')}
              className="flex items-center gap-0.5 text-[11px] text-emerald-600 hover:text-emerald-700 py-0.5 transition-colors">
              <Icon name="plus" size={10}/>Rev item
            </button>
            <button onClick={()=>onAddItem('cost')}
              className="flex items-center gap-0.5 text-[11px] text-red-400 hover:text-red-600 py-0.5 transition-colors">
              <Icon name="plus" size={10}/>Cost item
            </button>
            <button onClick={()=>onAddItem('pct')}
              className="flex items-center gap-0.5 text-[11px] text-amber-500 hover:text-amber-700 py-0.5 transition-colors">
              <Icon name="plus" size={10}/>% item
            </button>
          </div>
          {/* Category totals footer */}
          <div className="mt-2 pt-2 border-t border-slate-100 dark:border-slate-700 grid grid-cols-3 text-center gap-1">
            <div>
              <div className="text-[9px] uppercase tracking-wide text-slate-400">Revenue</div>
              <div className="text-xs font-mono font-semibold text-emerald-600 dark:text-emerald-400">{cur(cm.revenue)}</div>
            </div>
            <div>
              <div className="text-[9px] uppercase tracking-wide text-slate-400">Cost</div>
              <div className="text-xs font-mono font-semibold text-red-500">({cur(cm.cost)})</div>
            </div>
            <div>
              <div className="text-[9px] uppercase tracking-wide text-slate-400">Net</div>
              <div className={`text-xs font-mono font-bold ${cm.net>=0?'text-emerald-600 dark:text-emerald-400':'text-red-500'}`}>{cur(cm.net)}</div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Scenario Column (2-column comparison card) ────────────────────────────

        </div>
        <div className="flex justify-between text-xs">
          <span className="text-slate-400">Net Margin</span>
          <span className={`font-mono font-semibold ${m.margin>=0?col.text:'text-red-500'}`}>{pct(m.margin)}</span>
        </div>
        <button onClick={onSavePackage} className="w-full flex items-center justify-center gap-1.5 text-xs font-medium py-2 mt-1 rounded-lg border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
          <Icon name="pkg" size={13}/>Save as Package

// ── Comparison Table ───────────────────────────────────────────────────────
function ComparisonTable({ scenarios }) {
  const cur = useCur();
  const metrics = scenarios.map(s => calcMetrics(s));
  const rows = [
    {key:'rev',    label:'Total Revenue',   vals:metrics.map(m=>m.rev),      fmt:cur, best:'high'},
    {key:'tot',    label:'Total Cost',      vals:metrics.map(m=>m.tot),      fmt:cur, best:'low'},
    {key:'direct', label:'Direct Costs',    vals:metrics.map(m=>m.direct),   fmt:cur, best:'low'},
    {key:'gross',  label:'Gross Profit',    vals:metrics.map(m=>m.gross),    fmt:cur, best:'high'},
    {key:'net',    label:'Net Profit',      vals:metrics.map(m=>m.net),      fmt:cur, best:'high'},
    {key:'grossMgn',label:'Gross Margin',   vals:metrics.map(m=>m.grossMgn), fmt:pct, best:'high'},
    {key:'netMgn', label:'Net Margin',      vals:metrics.map(m=>m.netMgn),   fmt:pct, best:'high'},
    {key:'cpu',    label:'Cost / Unit',     vals:metrics.map(m=>m.cpu),      fmt:cur, best:'low'},
    {key:'ppu',    label:'Profit / Unit',   vals:metrics.map(m=>m.ppu),      fmt:cur, best:'high'},
  ];
  const getBest = (vals, dir) => dir==='high' ? vals.indexOf(Math.max(...vals)) : vals.indexOf(Math.min(...vals));
  return (
    <div className="overflow-x-auto">
      <table className="w-full text-sm">
        <thead>
          <tr className="border-b border-slate-200 dark:border-slate-700">
            <th className="text-left py-3 px-4 text-xs font-semibold uppercase tracking-wide text-slate-500">Metric</th>
            {scenarios.map((s,i)=>(
              <th key={s.id} className="text-right py-3 px-4 font-medium">
                <div className="flex items-center justify-end gap-1.5">
                  <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{background:SCOL[i]?.dot}} />
                  <span className="text-xs">{s.subtitle||s.name}</span>
                </div>
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.map(row=>{
            const bi = getBest(row.vals, row.best);
            return (
              <tr key={row.key} className="border-b border-slate-100 dark:border-slate-700/50 hover:bg-slate-50 dark:hover:bg-slate-800/50">
                <td className="py-2.5 px-4 text-xs text-slate-500 dark:text-slate-400">{row.label}</td>
                {row.vals.map((v,i)=>(
                  <td key={i} className={`py-2.5 px-4 text-right font-semibold text-xs font-mono ${i===bi?'text-emerald-600 dark:text-emerald-400':v<0?'text-red-500':''}`}>
                    {row.fmt(v)}{i===bi&&<span className="ml-1">★</span>}
                  </td>
                ))}
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ── Variance Section ───────────────────────────────────────────────────────
function VarianceSection({ scenarios }) {
  const cur = useCur();
  const metrics = scenarios.map(s => calcMetrics(s));
  const pairs = [[0,1],[1,2],[0,2]].filter(([a,b])=>scenarios[a]&&scenarios[b]);
  const mkeys = [{key:'rev',label:'Revenue',fmt:cur},{key:'net',label:'Net Profit',fmt:cur},{key:'netMgn',label:'Net Margin',fmt:pct},{key:'ppu',label:'Profit/Unit',fmt:cur}];
  return (
    <div>
      <h3 className="font-semibold text-sm mb-3 flex items-center gap-2"><Icon name="activity" size={15} cls="text-slate-400" />Variance Analysis</h3>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
        {pairs.map(([ai,bi])=>{
          const mA=metrics[ai], mB=metrics[bi], sA=scenarios[ai], sB=scenarios[bi];
          const label=`${sA.subtitle||sA.name} vs ${sB.subtitle||sB.name}`;
          return (
            <Card key={label} cls="p-4">
              <div className="flex items-center gap-2 mb-3 text-xs font-semibold">
                <span className="w-2 h-2 rounded-full" style={{background:SCOL[ai]?.dot}} />
                <span className="text-slate-600 dark:text-slate-300 truncate">{label}</span>
                <span className="w-2 h-2 rounded-full" style={{background:SCOL[bi]?.dot}} />
              </div>
              <div className="space-y-2">
                {mkeys.map(({key,label:ml,fmt})=>{
                  const diff = mB[key]-mA[key];
                  const diffPct = mA[key]!==0 ? (diff/Math.abs(mA[key]))*100 : 0;
                  const pos = diff>0;
                  return (
                    <div key={key} className="flex items-center justify-between text-xs">
                      <span className="text-slate-500">{ml}</span>
                      <span className={`flex items-center gap-1 font-semibold ${pos?'text-emerald-600 dark:text-emerald-400':'text-red-500'}`}>
                        <Icon name={pos?'trendUp':'trendDown'} size={11} />
                        {fmt(Math.abs(diff))} ({Math.abs(diffPct).toFixed(0)}%)
                      </span>
                    </div>
                  );
                })}
              </div>
            </Card>
          );
        })}
      </div>
    </div>
  );
}

// ── AI Insight Panel ───────────────────────────────────────────────────────
function AIInsightPanel({ scenarios }) {
  const cur = useCur();
  const metrics = scenarios.map(s=>calcMetrics(s));
  const bestNet = metrics.reduce((b,m,i)=>m.net>b.val?{val:m.net,i}:b,{val:-Infinity,i:0});

  ];

            <Icon name="sparkle" size={15} cls="text-white" />

          <div><p className="font-semibold text-sm">AI Scenario Insights</p><p className="text-xs text-slate-400">Auto-generated from your data</p></div>

// ── Donut Chart ───────────────────────────────────────────────────────────
function DonutChart({ segments, size=88 }) {
  const total = segments.reduce((s,g) => s + Math.max(0, g.value), 0);
  if (total === 0) return (
    <svg width={size} height={size}>
      <circle cx={size/2} cy={size/2} r={size/2-7} fill="none" stroke="#e2e8f0" strokeWidth="11" />
    </svg>
  );
  const cx=size/2, cy=size/2, R=size/2-7, ri=R*0.52;
  let angle=-Math.PI/2;
  const paths = segments.filter(s=>s.value>0).map(seg => {
    const frac=seg.value/total, sweep=frac*2*Math.PI;
    const c1=Math.cos(angle),s1=Math.sin(angle),c2=Math.cos(angle+sweep),s2=Math.sin(angle+sweep);
    const large=sweep>Math.PI?1:0;
    const d=[
      `M ${cx+ri*c1} ${cy+ri*s1}`,
      `L ${cx+R*c1} ${cy+R*s1}`,
      `A ${R} ${R} 0 ${large} 1 ${cx+R*c2} ${cy+R*s2}`,
      `L ${cx+ri*c2} ${cy+ri*s2}`,
      `A ${ri} ${ri} 0 ${large} 0 ${cx+ri*c1} ${cy+ri*s1}`,
      'Z'
    ].join(' ');
    angle += sweep;
    return { d, color:seg.color, label:seg.label, pct:Math.round(frac*100) };
  });
  return (
    <svg width={size} height={size}>
      {paths.map((p,i) => (
        <path key={i} d={p.d} fill={p.color} stroke="white" strokeWidth="1.5">
          <title>{p.label} — {p.pct}%</title>
        </path>
      ))}
    </svg>
  );
}

function ScenarioPieBlock({ scenario, textCls }) {
  const cur = useCur();
  const m = calcMetrics(scenario);
  const catMets = (scenario.categories||[]).map(cat => ({ ...calcCategoryMetrics(cat), cat }));
  const revSegs = catMets.filter(cm => cm.revenue > 0)
    .map((cm, i) => ({ label:(cm.cat.icon?cm.cat.icon+' ':'')+cm.cat.name, value:cm.revenue, color:CHART_COLORS[i%CHART_COLORS.length] }));
  const expSegs = catMets.filter(cm => cm.cost > 0)
    .map((cm, i) => ({ label:(cm.cat.icon?cm.cat.icon+' ':'')+cm.cat.name, value:cm.cost, color:CHART_COLORS[i%CHART_COLORS.length] }));
  const Legend = ({segs}) => (
    <div className="space-y-0.5 mt-1">
      {segs.map((s,i) => (
        <div key={i} className="flex items-center gap-1 text-[10px]">
          <span className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{background:s.color}}/>
          <span className="truncate text-slate-400 flex-1">{s.label}</span>
          <span className="font-mono text-slate-500 flex-shrink-0">{s.pct}%</span>
        </div>
      ))}
      {segs.length === 0 && <div className="text-[10px] text-slate-300 italic">No data</div>}
    </div>
  );
  return (
    <div>
      <p className={`text-xs font-bold mb-3 truncate ${textCls}`}>{scenario.label||scenario.name}</p>
      <div className="grid grid-cols-2 gap-4">
        <div>
          <p className="text-[10px] font-semibold uppercase tracking-wide text-emerald-600 dark:text-emerald-400 mb-1">Revenue <span className="font-mono">{cur(m.revenue)}</span></p>
          <div className="flex justify-center"><DonutChart segments={revSegs} size={80}/></div>
          <Legend segs={revSegs}/>
        </div>
        <div>
          <p className="text-[10px] font-semibold uppercase tracking-wide text-red-500 mb-1">Cost <span className="font-mono">{cur(m.expenses)}</span></p>
          <div className="flex justify-center"><DonutChart segments={expSegs} size={80}/></div>
          <Legend segs={expSegs}/>
        </div>
      </div>
    </div>
  );
}

// ── Comparison Pair Row ───────────────────────────────────────────────────
function ComparisonPairRow({ cmp, project, handlers, onSavePackage, onRemove, pairIdx }) {
  const cur = useCur();
  const left = project.scenarios.find(s => s.id === cmp.leftId);
  const right = project.scenarios.find(s => s.id === cmp.rightId);
  if (!left || !right) return null;
  const mL = calcMetrics(left), mR = calcMetrics(right);
  const diff = mR.net - mL.net;
  const better = diff > 0 ? 'right' : diff < 0 ? 'left' : 'tie';

  const makeH = (s, colIdx) => ({
    onUpdate:      (f,v)       => handlers.updScenario(s.id,f,v),
    onUpdateItem:  (c,iid,f,v) => handlers.updItem(s.id,c,iid,f,v),
    onAddItem:     (cid,type)  => handlers.addItem(s.id,cid,type),
    onRemoveItem:  (cid,iid)   => handlers.remItem(s.id,cid,iid),
    onAddCat:      (type)      => handlers.addCat(s.id, type),
    onRemoveCat:   (cid)       => handlers.remCat(s.id,cid),
    onUpdateCat:   (cid,f,v)   => handlers.updCat(s.id,cid,f,v),
    onSavePackage: ()          => onSavePackage(s),
    colIdx,
  });

  return (
    <div className="mb-6">
      {/* Pair header */}
      <div className="flex items-center justify-between mb-3">
        <h3 className="text-sm font-semibold text-slate-700 dark:text-slate-200 flex items-center gap-2">
          <span className="w-6 h-6 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center text-xs font-bold text-slate-500">
            {pairIdx+1}
          </span>
          Comparison {pairIdx+1}
          <span className="font-normal text-slate-400">—</span>
          <span className="font-normal text-slate-500 text-xs truncate max-w-48">
            {left.label||left.name} vs {right.label||right.name}
          </span>
        </h3>
        <button onClick={onRemove} className="text-xs text-slate-400 hover:text-red-500 transition-colors flex items-center gap-1 px-2 py-1 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20">
          <Icon name="x" size={13} />Clear
        </button>
      </div>

      {/* Two columns */}
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        <ScenarioColumn scenario={left}  colIdx={pairIdx*2}   {...makeH(left,  pairIdx*2)} />
        <ScenarioColumn scenario={right} colIdx={pairIdx*2+1} {...makeH(right, pairIdx*2+1)} />
      </div>

      {/* Net diff summary bar */}
      <div className={`mt-3 px-4 py-2.5 rounded-xl flex items-center justify-between text-sm
        ${better==='tie'?'bg-slate-100 dark:bg-slate-800':'bg-slate-50 dark:bg-slate-800'}`}>
        <div className="flex items-center gap-2 text-xs text-slate-500">
          <span className="font-semibold">{left.label||left.name}</span>
          <span>Revenue {cur(mL.revenue)} · Expenses {cur(mL.expenses)} · Net</span>
          <span className={`font-bold ${mL.net>=0?'text-emerald-600':'text-red-500'}`}>{cur(mL.net)}</span>
          <span className="text-slate-300">({pct(mL.margin)})</span>
        </div>
        <div className={`text-xs font-bold px-2 py-1 rounded-lg ${
          better==='right'?'text-emerald-700 dark:text-emerald-300 bg-emerald-100 dark:bg-emerald-900/30':
          better==='left'?'text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/30':
          'text-slate-500 bg-slate-200'}`}>
          {better==='tie'?'Equal':better==='right'?`▶ ${right.label||right.name} +${cur(Math.abs(diff))}`:`◀ ${left.label||left.name} +${cur(Math.abs(diff))}`}
        </div>
        <div className="flex items-center gap-2 text-xs text-slate-500">
          <span className={`font-bold ${mR.net>=0?'text-emerald-600':'text-red-500'}`}>{cur(mR.net)}</span>
          <span className="text-slate-300">({pct(mR.margin)})</span>
          <span>Net · Revenue {cur(mR.revenue)} · Expenses {cur(mR.expenses)}</span>
          <span className="font-semibold">{right.label||right.name}</span>
        </div>
      </div>

      <ChartsSection left={left} right={right} />
    </div>
  );
}

        {comparisons.map((cmp, idx) => (
          <ComparisonPairRow
            key={cmp.id}
            cmp={cmp}
            project={project}
            handlers={handlers}
            onSavePackage={onSavePackage}
            onRemove={() => handlers.removeComparison(project.id, cmp.id)}

        <button
          onClick={() => handlers.addComparison(project.id)}
          className="w-full py-3 rounded-xl border-2 border-dashed border-slate-200 dark:border-slate-700 text-slate-400 hover:text-indigo-600 hover:border-indigo-300 dark:hover:border-indigo-700 transition-colors flex items-center justify-center gap-2 text-sm font-medium">

      </div>
    </div>
